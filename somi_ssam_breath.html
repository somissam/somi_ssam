<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호흡 · somi_ssam</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

/* ══════════════════════════════════════
   CSS 변수 / 테마
══════════════════════════════════════ */
:root {
  --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c27; --border:#2a2a3d;
  --accent:#7c6af7; --accent2:#f76ac8; --accent3:#6af7c8; --counting:#f7c26a;
  --text:#e8e8f0; --text2:#8888aa;
  --col-wait:#f7c26a; --col-inhale:#7c6af7; --col-write:#f76ac8;
}
.theme-ivory {
  --bg:#f5f0e8; --surface:#fffdf7; --surface2:#f0ebe0; --border:#d8cfc0;
  --accent:#6b5ce7; --accent2:#e05fa0; --accent3:#2db89a; --counting:#c8960a;
  --text:#2a2420; --text2:#7a6e60;
  --col-wait:#c8960a; --col-inhale:#6b5ce7; --col-write:#e05fa0;
}

/* ══════════════════════════════════════
   리셋 / 기본
══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* ══════════════════════════════════════
   헤더 (vocal_lab 기준 통일)
══════════════════════════════════════ */
.lab-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.lab-brand{display:flex;flex-direction:column;gap:1px;text-align:right;}
.lab-brand .brand-title{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'DM Mono',monospace;}
.lab-brand .brand-sub{font-size:0.65rem;color:var(--text2);letter-spacing:3px;text-transform:uppercase;}
.home-link{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);text-decoration:none;font-size:0.88rem;font-weight:500;transition:all 0.2s;font-family:inherit;min-width:120px;justify-content:center;white-space:nowrap;}
.home-link:hover{border-color:var(--accent);color:var(--text);}

/* ══════════════════════════════════════
   패턴 선택 화면
══════════════════════════════════════ */
.pattern-select{max-width:600px;margin:0 auto;padding:28px 20px 60px;}
.select-title{font-size:1.1rem;font-weight:700;margin-bottom:6px;}
.select-desc{color:var(--text2);font-size:0.82rem;margin-bottom:24px;line-height:1.6;}
.pattern-cards{display:flex;flex-direction:column;gap:12px;}

/* 패턴 카드 */
.pattern-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:all 0.2s;position:relative;}
.pattern-card:hover:not(.locked){border-color:var(--accent);transform:translateX(4px);}
.pattern-card h3{font-size:0.95rem;font-weight:600;margin-bottom:4px;}
.pattern-card p{color:var(--text2);font-size:0.78rem;line-height:1.5;}
.pattern-meta{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center;}
.meta-tag{font-size:0.68rem;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.lv-badge{font-size:0.65rem;padding:2px 8px;border-radius:10px;background:rgba(124,106,247,0.15);color:var(--accent);border:1px solid var(--accent);font-weight:600;}

/* 잠금 카드 */
.pattern-card.locked{opacity:0.45;cursor:default;}
.lock-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;border-radius:14px;background:rgba(10,10,15,0.18);}
.theme-ivory .lock-overlay{background:rgba(245,240,232,0.18);}

/* ══════════════════════════════════════
   연습 화면
══════════════════════════════════════ */
#practice-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;flex-direction:column;overflow-y:auto;}
.prac-header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.prac-header h2{font-size:0.95rem;font-weight:600;flex:1;}
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:10px 20px;border-radius:10px;font-size:0.88rem;font-weight:500;transition:all 0.2s;font-family:inherit;cursor:pointer;min-width:120px;justify-content:center;white-space:nowrap;}
.back-btn:hover{border-color:var(--accent);color:var(--text);}
.prac-body{display:flex;flex-direction:column;align-items:center;padding:24px 20px 52px;gap:22px;max-width:560px;margin:0 auto;width:100%;}

/* 모드 탭 */
.mode-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.m-tab{padding:9px 22px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:0.88rem;transition:all 0.2s;}
.m-tab.active{background:var(--accent);border-color:var(--accent);color:white;font-weight:600;}

/* 버티기 목표 탭 */
.hold-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}

/* 박자 행 */
.beat-row{display:flex;gap:16px;align-items:center;justify-content:center;width:100%;max-width:420px;}
.beat-num{font-family:'DM Mono',monospace;font-size:2.8rem;font-weight:700;color:var(--border);transition:color 0.08s,text-shadow 0.08s,transform 0.08s;min-width:42px;text-align:center;line-height:1;}
.beat-num.col-wait{color:rgba(247,194,106,0.35);}
.beat-num.col-inhale{color:rgba(124,106,247,0.35);}
.beat-num.col-write{color:rgba(247,106,200,0.6);}
.beat-num.active-counting{color:var(--counting);text-shadow:0 0 24px rgba(247,194,106,0.8),0 0 48px rgba(247,194,106,0.4);transform:scale(1.15);}
.beat-num.active-exhale{color:var(--accent);text-shadow:0 0 24px rgba(124,106,247,0.8),0 0 48px rgba(124,106,247,0.4);transform:scale(1.15);}
.beat-num.active-inhale{color:var(--col-inhale) !important;text-shadow:none;transform:scale(1.15);}
.beat-num.active-inhale-bright{color:var(--col-inhale);text-shadow:0 0 24px rgba(124,106,247,0.8),0 0 48px rgba(124,106,247,0.4);transform:scale(1.15);}
.beat-num.active-write{color:var(--accent2);text-shadow:0 0 24px rgba(247,106,200,0.9),0 0 48px rgba(247,106,200,0.5);transform:scale(1.18);}

/* 쓰기호흡 진행 바 */
.progress-bar-wrap{width:100%;max-width:420px;}
.write-segments{width:100%;max-width:420px;}
.write-seg{padding:10px 4px;border-radius:10px;text-align:center;font-size:0.78rem;font-weight:600;opacity:0.4;transition:opacity 0.15s,box-shadow 0.15s;min-width:0;overflow:hidden;}
.write-seg.wait{background:rgba(247,194,106,0.2);color:var(--col-wait);border:1.5px solid rgba(247,194,106,0.4);}
.write-seg.inhale{background:rgba(124,106,247,0.2);color:var(--col-inhale);border:1.5px solid rgba(124,106,247,0.4);}
.write-seg.write-s{background:rgba(247,106,200,0.2);color:var(--col-write);border:1.5px solid rgba(247,106,200,0.4);}
.write-seg.active{opacity:1;}
.write-seg.active.wait{box-shadow:0 0 10px rgba(247,194,106,0.5);}
.write-seg.active.inhale{box-shadow:0 0 10px rgba(124,106,247,0.5);}
.write-seg.active.write-s{box-shadow:0 0 10px rgba(247,106,200,0.5);}

/* 인포박스 */
.info-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:20px 24px;text-align:center;width:100%;max-width:420px;min-height:96px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;}
.info-action{font-size:2.1rem;font-weight:700;transition:all 0.2s;line-height:1.2;}
.info-sub{font-size:0.85rem;color:var(--text2);}

/* 타이머 */
.timer-wrap{text-align:center;}
.timer-main{font-family:'DM Mono',monospace;font-size:3rem;font-weight:500;letter-spacing:1px;color:var(--text);}
.timer-main.running{color:var(--accent3);}

/* 컨트롤 */
.controls{display:flex;gap:14px;align-items:center;}
.ctrl-btn{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;font-size:1.3rem;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
.ctrl-btn.reset{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.ctrl-btn.reset:hover{border-color:var(--counting);color:var(--counting);}
.ctrl-btn.play{background:var(--accent);color:white;width:68px;height:68px;font-size:1.5rem;}
.ctrl-btn.play:hover{background:#6a58e8;transform:scale(1.05);}
.ctrl-btn.stop{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.ctrl-btn.stop:hover{border-color:#f76a6a;color:#f76a6a;}

/* 루프 카운터 */
.loop-counter{font-family:'DM Mono',monospace;font-size:1.65rem;font-weight:700;color:var(--text2);margin-top:2px;}

/* 볼륨 */
.vol-wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;}
.vol-row{display:flex;align-items:center;gap:10px;font-size:0.78rem;color:var(--text2);}
.vol-row span{min-width:70px;}
.vol-row input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer;}

/* 서브 탭 (쓰기 기간 선택 등) */
.sub-tabs{display:flex;gap:8px;flex-wrap:wrap;}
.sub-tab{padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:0.82rem;transition:all 0.2s;}
.sub-tab.active{background:var(--accent);border-color:var(--accent);color:white;font-weight:600;}

/* 성공 오버레이 */
#success-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,15,0.96);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.success-btn{padding:14px 36px;background:var(--accent);border:none;border-radius:14px;color:white;font-size:1rem;font-family:inherit;cursor:pointer;font-weight:500;}
@keyframes bounce{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>

<header class="lab-header">

  <button class="success-btn" onclick="closeSuccess()">다시 도전하기</button>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   somi_ssam_breath.html  v2 (완전 독립 재설계)

   [ 섹션 A ] 호흡 패턴 데이터 (BREATH_PATTERNS)
   [ 섹션 B ] 레벨 기본값
   [ 섹션 C ] 저장/로드 · 잠금 헬퍼
   [ 섹션 D ] 오디오 엔진
   [ 섹션 E ] 스케줄러 (breathCycle / breathWrite / breathHold)
   [ 섹션 F ] 연습 UI 빌더
   [ 섹션 G ] 비주얼 업데이트
   [ 섹션 H ] 종료 · 기록
   [ 섹션 I ] 카드 렌더 · 진입점
════════════════════════════════════════════════════════════ */

/* ════════════════════════════════════════════════
   【 섹션 A 】 호흡 패턴 데이터
   ──────────────────────────────────────────────
   새 패턴 추가 방법:
   1. 아래 BREATH_PATTERNS 배열에 객체 추가
   2. scheduler 값: 'breathCycle' | 'breathWrite' | 'breathHold'
   3. 엔진 코드(섹션 D·E) 수정 불필요
════════════════════════════════════════════════ */
const BREATH_PATTERNS = [
  {
    id: 'breath_full',
    name: '전체 호흡',
    desc: '시간에 맞추어 내 호흡 전체의 양과 근육의 움직임을 느껴가며 조절하는 연습',
    level: 'lv1', bpm: 60,
    tags: ['60 BPM', '기본 / 연습'],
    modeLabels: ['기본', '연습'],
    scheduler: 'breathCycle',
  },
  {
    id: 'breath_write',
    name: '쓰기 호흡',

    modeLabels: ['기본', '연습'],
    scheduler: 'breathWrite',

    id: 'breath_hold',

    level: 'lv3', bpm: 60,
    tags: ['60 BPM', '15s / 30s / 45s / 60s / ∞'],
    modeLabels: null, // 모드 탭 없음
    scheduler: 'breathHold',
  },
];

/* ════════════════════════════════════════════════
   【 섹션 B 】 레벨 기본값
════════════════════════════════════════════════ */
const DEFAULT_LEVEL_SETTINGS = [
  { id: 'lv1', label: 'Lv1' },
  { id: 'lv2', label: 'Lv2' },
  { id: 'lv3', label: 'Lv3' },
  { id: 'ing', label: 'ing' },
];

/* ════════════════════════════════════════════════
   【 섹션 C 】 저장/로드 · 잠금 헬퍼
════════════════════════════════════════════════ */
function loadData(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function saveData(key, val) {
  try { const j=JSON.stringify(val); localStorage.setItem(key, j); if(window._fsSet) window._fsSet(key, j); } catch(e) {}
}

let patternLocks        = loadData('somi_pattern_locks', {});
let patternLevelOverrides = loadData('somi_pattern_levels', {});
let levelSettings       = loadData('somi_level_settings', null) || DEFAULT_LEVEL_SETTINGS.map(l=>({...l}));
let practiceLogs        = loadData('somi_logs', {});
let currentProfileId    = null; // student.html에서 넘어온 프로필 id

// 잠금 여부: patternLocks[profileId][patternId] === false → 잠김
function isLocked(patternId) {
  if (!currentProfileId) return false;
  const pl = patternLocks[currentProfileId];
  if (!pl) return false;
  return pl[patternId] === false;
}

// 패턴 레벨 (선생님 변경 우선)
function getPatternLevel(patternId) {
  return patternLevelOverrides[patternId] || (BREATH_PATTERNS.find(p=>p.id===patternId)||{}).level;
}

// 테마 적용
let currentTheme = loadData('somi_theme', 'dark');
function applyTheme() {
  document.body.classList.toggle('theme-ivory', currentTheme === 'ivory');
}

/* ════════════════════════════════════════════════
   【 섹션 D 】 오디오 엔진
════════════════════════════════════════════════ */
let audioCtx=null, masterGain=null, metronomeGain=null;
let metronomeVol = 1.0;

console.log('[AUDIO-FIX v4] SR기억+정찰병자동교체 빌드 로드됨 (breath) — 2026-06-10');
// ── iPad Safari 오디오 언락 v4 (breath): 세션 활성화 + SR기억 + 정찰병 자동 교체 ──
// WebKit 버그: 컨텍스트 샘플레이트와 하드웨어 출력이 불일치하면 state와 무관하게 클럭(currentTime)이 0에 동결됨
const _SILENT_WAV='data:audio/wav;base64,UklGRoQJAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YWAJAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=';
let _silentEl=null,_clockWatchdog=null,_ctxRebuilds=0,_needGestureRebuild=false,_awaitClock=false;
let _probes=[]; // 샘플레이트 정찰병 컨텍스트 [{ctx,sr}]
const _SR_KEY='somi_audio_sr'; // 이 기기에서 클럭이 도는 것으로 확인된 샘플레이트 (모듈 공유)
function _storedSR(){try{const v=parseInt(localStorage.getItem(_SR_KEY)||'0',10);return(v===44100||v===48000)?v:0;}catch(e){return 0;}}
function _rememberSR(sr){try{localStorage.setItem(_SR_KEY,String(sr));}catch(e){}}
function _srForAttempt(n){
  const st=_storedSR();const seq=[st||0,44100,48000].filter((v,i,a)=>a.indexOf(v)===i);
  return seq[n%seq.length];
}
function _setIOSSession(){
  try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}
}
function _playSilentElement(){
  try{
    if(!_silentEl){_silentEl=document.createElement('audio');_silentEl.setAttribute('playsinline','');_silentEl.loop=true;_silentEl.src=_SILENT_WAV;}
    const p=_silentEl.play();if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
function _stopSilentElement(){try{if(_silentEl){_silentEl.pause();_silentEl.currentTime=0;}}catch(e){}}
function _audioDiag(tag){
  try{
    const sess=(navigator.audioSession&&navigator.audioSession.state)||'API없음';
    console.log('[AUDIO-진단 '+tag+'] state='+(audioCtx?audioCtx.state:'없음')
      +' sr='+(audioCtx?audioCtx.sampleRate:'-')
      +' t='+(audioCtx?audioCtx.currentTime.toFixed(4):'-')
      +' session='+sess+' rebuilds='+_ctxRebuilds);
  }catch(e){}
}
function _wireGains(){
  masterGain=audioCtx.createGain();masterGain.gain.value=1.95;masterGain.connect(audioCtx.destination);
  metronomeGain=audioCtx.createGain();metronomeGain.gain.value=metronomeVol;metronomeGain.connect(masterGain);
}
function _buildCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  _setIOSSession();
  const sr=_srForAttempt(_ctxRebuilds);
  try{audioCtx=sr?new AC({sampleRate:sr}):new AC();}
  catch(e){audioCtx=new AC();}
  _wireGains();
  _audioDiag('생성');
  return true;
}
function _unlockAudio(){
  if(!audioCtx)return;
  try{
    if(audioCtx.state!=='running')audioCtx.resume().catch(()=>{});
    const buf=audioCtx.createBuffer(1,1,22050),src=audioCtx.createBufferSource();
    src.buffer=buf;src.connect(audioCtx.destination);src.start(0);
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    g.gain.value=0.0001;o.connect(g);g.connect(audioCtx.destination);
    o.start(0);o.stop(audioCtx.currentTime+0.05);
  }catch(e){}
  _playSilentElement();
}
function _makeProbes(){
  if(_probes.length||!audioCtx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  [44100,48000].forEach(sr=>{
    if(audioCtx&&audioCtx.sampleRate===sr)return;
    try{
      const c=new AC({sampleRate:sr});
      if(c.state!=='running')c.resume().catch(()=>{});
      const b=c.createBuffer(1,1,22050),bs=c.createBufferSource();
      bs.buffer=b;bs.connect(c.destination);bs.start(0);
      _probes.push({ctx:c,sr:sr});
    }catch(e){}
  });
  if(_probes.length)console.log('[AUDIO] 정찰병 컨텍스트 생성: '+_probes.map(p=>p.sr).join(', '));
}
function _closeProbes(){
  _probes.forEach(p=>{try{p.ctx.close().catch(()=>{});}catch(e){}});
  _probes=[];
}
function _adoptProbe(p){
  console.log('[AUDIO] 🔄 정찰병 채택: sr='+p.sr+' t='+p.ctx.currentTime.toFixed(4));
  try{if(audioCtx)audioCtx.close().catch(()=>{});}catch(e){}
  audioCtx=p.ctx;
  _wireGains();
  _probes=_probes.filter(x=>x!==p);
  _closeProbes();
  _rememberSR(p.sr);
  _awaitClock=true; // 스케줄러가 새 클럭에 자동 재앵커
}
function _teardownCtx(){
  try{if(audioCtx)audioCtx.close().catch(()=>{});}catch(e){}
  audioCtx=null;masterGain=null;metronomeGain=null;
}
function _gestureRebuild(){
  // ★ 반드시 유저 제스처 콜스택 안에서만 호출
  _needGestureRebuild=false;
  _ctxRebuilds++;
  _teardownCtx();
  if(_buildCtx()){_unlockAudio();_awaitClock=true;console.log('[AUDIO] 제스처 내 컨텍스트 재생성 #'+_ctxRebuilds+' (sr시도='+(_srForAttempt(_ctxRebuilds)||'기본')+')');}
}
function _startClockWatchdog(){
  if(_clockWatchdog)clearInterval(_clockWatchdog);
  let tries=0;
  _clockWatchdog=setInterval(()=>{
    if(!audioCtx){clearInterval(_clockWatchdog);_clockWatchdog=null;return;}
    if(audioCtx.currentTime>0){
      clearInterval(_clockWatchdog);_clockWatchdog=null;_needGestureRebuild=false;_ctxRebuilds=0;
      _stopSilentElement();_rememberSR(audioCtx.sampleRate);_closeProbes();
      console.log('[AUDIO] ✅ 클럭 정상 기동 t='+audioCtx.currentTime.toFixed(4)+' sr='+audioCtx.sampleRate);
      return;}
    tries++;
    if(tries>=2&&_probes.length){
      const live=_probes.find(p=>{try{return p.ctx.currentTime>0;}catch(e){return false;}});
      if(live){_adoptProbe(live);return;}
    }
    if(tries===3){try{audioCtx.suspend().then(()=>audioCtx.resume()).catch(()=>{});}catch(e){}_audioDiag('정지·소생시도');}
    else if(tries>=10){
      clearInterval(_clockWatchdog);_clockWatchdog=null;_needGestureRebuild=true;
      _audioDiag('기동실패');
      console.warn('[AUDIO] 클럭 기동 실패 — 다음 터치에서 샘플레이트 바꿔 재생성');
    }
  },100);
}
function initAudio(){
  if(!audioCtx){if(!_buildCtx())return;}
  _unlockAudio();
}
function ensureAudio(){
  if(_needGestureRebuild){_gestureRebuild();}
  else if(!audioCtx)initAudio();
  else _unlockAudio();
  if(audioCtx&&audioCtx.currentTime<=0){_makeProbes();_startClockWatchdog();}
}
// ★ touchstart는 iOS 오디오 언락 제스처 불인정 — 컨텍스트 '생성' 금지, 기존 ctx 언락만
document.addEventListener('touchstart',()=>{if(audioCtx)_unlockAudio();},{passive:true,capture:true});
document.addEventListener('touchend',ensureAudio,{passive:true,capture:true});
document.addEventListener('click',ensureAudio,{passive:true});

function playClick(type, time) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(metronomeGain);
    const f = type==='accent' ? 1200 : type==='soft' ? 600 : 900;
    const v = type==='accent' ? 0.4  : type==='soft' ? 0.18 : 0.28;
    o.frequency.value = f; o.type = 'sine';
    g.gain.setValueAtTime(v, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
    o.start(time); o.stop(time + 0.1);
  } catch(e) {}
}

/* ════════════════════════════════════════════════
   【 섹션 E 】 스케줄러
   ──────────────────────────────────────────────
   공통 런타임 변수
════════════════════════════════════════════════ */
let EX = '', TMODE = 'basic', SUB = '4', HTARGET = 15;
let seqPhase = 'counting', seqStep = 0, loopCount = 0;
let isPlaying = false, isPaused = false;
let mainStartWallTime = 0, elapsedSeconds = 0, pausedElapsed = 0;
let nextBeatTime = 0, beatInterval = 1;
let schedulerTimer = null, timerRafId = null;
let beatQueue = [];
let stopScheduled = false, stopSuccess = false, stopAudioTime = 0;

function currentPat() { return BREATH_PATTERNS.find(p => p.id === EX); }

/* ── E-1. 메인 루프 ── */
function startEngine() {
  // ═══ iPad Safari: 제스처 콜스택 안에서 동기식으로 생성+언락+정찰병까지 일사천리 ═══
  if (_needGestureRebuild) _gestureRebuild();
  if (!audioCtx) initAudio();
  if (!audioCtx) return;
  _unlockAudio();
  if (audioCtx.currentTime <= 0) { _makeProbes(); _awaitClock = true; _startClockWatchdog(); }

  const pat = currentPat(); if (!pat) return;
  beatInterval = 60 / pat.bpm;

  if (isPaused) {
    // 일시정지에서 재개
    const resumeAt = audioCtx.currentTime + 0.05;
    mainStartWallTime = Date.now() - pausedElapsed * 1000 + (resumeAt - audioCtx.currentTime) * 1000;
    nextBeatTime = resumeAt;
    isPaused = false;
  } else {
    const pat = currentPat();
    // 쓰기호흡: 카운팅 없이 바로 main 진입 (패턴 안에 카운팅이 내장되어 있음)
    if (pat && pat.scheduler === 'breathWrite') {
      seqPhase = 'main'; seqStep = 0; loopCount = 1;
      nextBeatTime = audioCtx.currentTime + 0.05;
      mainStartWallTime = Date.now() + 0.05 * 1000;
    } else {
      seqPhase = 'counting'; seqStep = 0; loopCount = 0;
      nextBeatTime = audioCtx.currentTime + 0.05;
      mainStartWallTime = 0;
    }
  }

  isPlaying = true;
  const pb = document.getElementById('play-btn'); if (pb) pb.textContent = '⏸';
  schedulerTimer = setInterval(schedulerTick, 25);
  timerRafId = requestAnimationFrame(timerFrame);
}

function schedulerTick() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  // Safari 안전장치: 클럭이 0이면 대기, 움직이기 시작한 순간 재앵커
  if (_awaitClock) {
    if (now <= 0) return;
    nextBeatTime = now + 0.05;
    _awaitClock = false;
  }
  while (nextBeatTime < now + 0.15) {
    scheduleOneBeat(nextBeatTime);
    nextBeatTime += beatInterval;
  }
}

function scheduleOneBeat(time) {
  let clickType = 'normal', vis = null;

  if (seqPhase === 'counting') {
    const idx = seqStep;
    clickType = idx === 0 ? 'accent' : 'normal';
    vis = { phase: 'counting', idx };
    seqStep++;
    if (seqStep >= 4) {
      if (stopScheduled) { playClick(clickType, time); beatQueue.push({time, vis}); return; }
      seqPhase = 'main'; seqStep = 0;
      if (mainStartWallTime === 0) mainStartWallTime = Date.now() + (time + beatInterval - audioCtx.currentTime) * 1000;
      loopCount++;
    }
  } else {
    // main 구간 — 패턴별 분기
    const pat = currentPat(); if (!pat) return;
    if      (pat.scheduler === 'breathCycle') { const r = schedBreathCycle(time); clickType = r.clickType; vis = r.vis; }
    else if (pat.scheduler === 'breathWrite') { const r = schedBreathWrite(time);  clickType = r.clickType; vis = r.vis; }
    else if (pat.scheduler === 'breathHold')  { const r = schedBreathHold(time);   clickType = r.clickType; vis = r.vis; }
  }

  playClick(clickType, time);
  beatQueue.push({ time, vis });
}

/* ── E-2. breathCycle (전체호흡) ── */
function schedBreathCycle(time) {
  const beats = parseInt(SUB) || 4;
  const total = beats * 2; // 내쉬기 beats + 마시기 beats
  const isExhale = seqStep < beats;
  const idx = seqStep % beats;

  const vis = { phase: isExhale ? 'exhale' : 'inhale', idx, loop: loopCount };
  const clickType = isExhale ? 'normal' : 'soft';

  seqStep++;
  if (seqStep >= total) {
    seqStep = 0;
    loopCount++;
    // 기본 모드: loopCount가 8을 초과하면 다음 루프 시작 전 종료
    if (TMODE === 'basic' && loopCount > 8) {
      scheduleStop(time + beatInterval);
    }
  }
  return { clickType, vis };
}

/* ── E-3. breathWrite (쓰기호흡) ── */
function schedBreathWrite(time) {
  const st = parseInt(SUB) || 2;
  const total = 4 + st; // 기다리기3 + 마시기1 + 쓰기st

  let clickType, vis;
  if (seqStep < 3)        { clickType = 'normal';  vis = { phase: 'waiting', idx: seqStep, total, loop: loopCount }; }
  else if (seqStep === 3) { clickType = 'accent';  vis = { phase: 'inhale',  idx: seqStep, total, loop: loopCount }; }
  else                    { clickType = 'soft';    vis = { phase: 'write',   idx: seqStep, total, loop: loopCount }; }

  seqStep++;
  if (seqStep >= total) {
    seqStep = 0;
    loopCount++;
    if (TMODE === 'basic' && loopCount > 8) scheduleStop(time + beatInterval);
  }
  return { clickType, vis };
}

/* ── E-4. breathHold (버티기호흡) ── */
function schedBreathHold(time) {
  const vis = { phase: 'hold', step: seqStep + 1 };
  seqStep++;
  // 이미 종료 예약됐으면 중복 호출 방지
  if (!stopScheduled && HTARGET > 0 && seqStep >= HTARGET) {
    scheduleStop(time + beatInterval, true);
  }
  return { clickType: 'soft', vis };
}

/* ── E-5. 종료 예약 ── */
function scheduleStop(audioTime, success = false) {
  stopScheduled = true; stopSuccess = success;
  stopAudioTime = audioTime;
}

/* ── E-6. 타이머 RAF ── */
function timerFrame(ts) {
  // 비주얼 업데이트: 재생 시간이 된 beat 처리
  const now = audioCtx ? audioCtx.currentTime : 0;
  while (beatQueue.length && beatQueue[0].time <= now + 0.02) {
    const { vis } = beatQueue.shift();
    applyVisual(vis);
  }
  // 종료 처리
  if (stopScheduled && audioCtx && audioCtx.currentTime >= stopAudioTime - 0.1) {
    stopScheduled = false;
    stopEngine();
    elapsedSeconds = 0; isPaused = false; pausedElapsed = 0;
    if (stopSuccess) showSuccess('목표 시간 달성! 🎉');
    else { logPractice(); showSuccess('기본 모드 완료!'); }
    return;
  }
  // 경과 시간 업데이트
  if (isPlaying && mainStartWallTime > 0) {
    elapsedSeconds = (Date.now() - mainStartWallTime) / 1000;
    const tm = document.getElementById('timer-main');
    if (tm) {
      const s = Math.max(0, Math.floor(elapsedSeconds));
      const cs = Math.floor((elapsedSeconds - Math.floor(elapsedSeconds)) * 100);
      tm.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0') + '.' + String(cs).padStart(2,'0');
      tm.className = 'timer-main running';
    }
  }
  timerRafId = requestAnimationFrame(timerFrame);
}

/* ════════════════════════════════════════════════
   【 섹션 F 】 연습 UI 빌더
════════════════════════════════════════════════ */
function startExercise(id) {
  if (isLocked(id)) return;
  initAudio(); EX = id;
  const pat = currentPat(); if (!pat) return;

  // 초기값
  if (id === 'breath_full')  { SUB = '4'; TMODE = 'basic'; }
  if (id === 'breath_write') { SUB = '2'; TMODE = 'basic'; }
  if (id === 'breath_hold')  { HTARGET = 15; TMODE = 'basic'; }

  document.getElementById('prac-title').textContent = pat.name;
  buildPracticeUI();
  document.getElementById('pattern-select').style.display = 'none';
  document.getElementById('practice-screen').style.display = 'flex';
}

function closePractice() {
  stopExercise();
  document.getElementById('practice-screen').style.display = 'none';
  document.getElementById('pattern-select').style.display = 'block';
}

function buildPracticeUI() {
  const body = document.getElementById('prac-body'); body.innerHTML = '';
  const pat = currentPat(); if (!pat) return;

  /* ── 버티기: 목표 시간 탭 ── */
  if (pat.scheduler === 'breathHold') {
    const ht = document.createElement('div'); ht.className = 'hold-tabs';
    [['15s','15'],['30s','30'],['45s','45'],['60s','60'],['∞','0']].forEach(([lbl, val]) => {
      const b = document.createElement('button'); b.className = 'm-tab';
      if ((val==='0' && HTARGET===0)||(val!=='0' && parseInt(val)===HTARGET)) b.classList.add('active');
      b.textContent = lbl;
      b.onclick = () => { HTARGET = parseInt(val); ht.querySelectorAll('.m-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); hardReset(); };
      ht.appendChild(b);
    });
    body.appendChild(ht);
  }

  /* ── 기본/연습 탭 ── */
  if (pat.modeLabels) {
    const mt = document.createElement('div'); mt.className = 'mode-tabs';
    pat.modeLabels.forEach(label => {
      const val = label === '기본' ? 'basic' : 'free';
      const b = document.createElement('button'); b.className = 'm-tab' + (TMODE===val?' active':'');
      b.textContent = label;
      b.onclick = () => { TMODE=val; mt.querySelectorAll('.m-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); hardReset(); };
      mt.appendChild(b);
    });
    body.appendChild(mt);
  }

  /* ── 쓰기호흡: 박자 수 선택 (2, 3, 4박만) ── */
  if (pat.scheduler === 'breathWrite') {
    const st = document.createElement('div'); st.className = 'sub-tabs';
    [['2박','2'],['3박','3'],['4박','4']].forEach(([lbl, val]) => {
      const b = document.createElement('button'); b.className = 'sub-tab' + (SUB===val?' active':'');
      b.textContent = lbl;
      b.onclick = () => { SUB=val; st.querySelectorAll('.sub-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); resetAndRebuild(); };
      st.appendChild(b);
    });
    body.appendChild(st);
  }

  /* ── 전체호흡: 박자 수 선택 ── */
  if (pat.scheduler === 'breathCycle') {
    const st = document.createElement('div'); st.className = 'sub-tabs';
    [['4박','4'],['5박','5'],['6박','6'],['7박','7'],['8박','8']].forEach(([lbl, val]) => {
      const b = document.createElement('button'); b.className = 'sub-tab' + (SUB===val?' active':'');
      b.textContent = lbl;
      b.onclick = () => { SUB=val; st.querySelectorAll('.sub-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); resetAndRebuild(); };
      st.appendChild(b);
    });
    body.appendChild(st);
  }

  /* ── 박자 표시 행 ── */
  const br = document.createElement('div'); br.className = 'beat-row'; br.id = 'beat-row';

  if (pat.scheduler === 'breathHold') {
    // 버티기: 카운팅 4개 + 큰 숫자 레이어
    const holdWrap = document.createElement('div');
    holdWrap.style.cssText = 'position:relative;width:220px;height:90px;display:flex;align-items:center;justify-content:center;';
    const countLayer = document.createElement('div'); countLayer.id = 'hold-count-layer';
    countLayer.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:12px;';
    for (let i=0; i<4; i++) {
      const s = document.createElement('span'); s.className = 'beat-num'; s.id = 'bn-'+i;
      s.style.fontSize = '2.8rem'; s.textContent = i+1; countLayer.appendChild(s);
    }
    holdWrap.appendChild(countLayer);
    const holdNumLayer = document.createElement('div'); holdNumLayer.id = 'hold-num-layer';
    holdNumLayer.style.cssText = 'position:absolute;inset:0;display:none;align-items:center;justify-content:center;';
    const bigNum = document.createElement('span'); bigNum.id = 'hold-big-num';
    bigNum.style.cssText = 'font-family:"DM Mono",monospace;font-size:4rem;font-weight:700;color:var(--accent3);text-shadow:0 0 24px rgba(106,247,200,0.8);';
    bigNum.textContent = '1'; holdNumLayer.appendChild(bigNum);
    holdWrap.appendChild(holdNumLayer);
    br.appendChild(holdWrap);

  } else if (pat.scheduler === 'breathWrite') {
    // 쓰기호흡: 카운팅 없이 바로 패턴 박자만 표시
    const beats = parseInt(SUB) || 2;
    const getWriteLabels = () => ['1','2','3','4', ...Array.from({length:beats},(_,i)=>String(i+1))];
    getWriteLabels().forEach((lbl, i) => {
      const s = document.createElement('span'); s.className = 'beat-num'; s.id = 'bn-'+i; s.textContent = lbl;
      if (i < 3) s.classList.add('col-wait');
      else if (i === 3) s.classList.add('col-inhale');
      else s.classList.add('col-write');
      br.appendChild(s);
    });

  } else {
    // breathCycle: 카운팅 레이어(1~4) + 패턴 레이어(n박) 분리
    const beats = parseInt(SUB) || 4;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;display:flex;align-items:center;justify-content:center;';

    // 카운팅 레이어 (1~4, 카운팅 중에만 보임)
    const countLayer = document.createElement('div'); countLayer.id = 'bc-count-layer';
    countLayer.style.cssText = 'display:flex;gap:16px;align-items:center;justify-content:center;';
    for (let i=0; i<4; i++) {
      const s = document.createElement('span'); s.className = 'beat-num'; s.id = 'bc-'+i; s.textContent = i+1;
      countLayer.appendChild(s);
    }

    // 패턴 레이어 (n박, 패턴 진입 후에만 보임)
    const patLayer = document.createElement('div'); patLayer.id = 'bc-pat-layer';
    patLayer.style.cssText = 'display:none;gap:16px;align-items:center;justify-content:center;';
    for (let i=0; i<beats; i++) {
      const s = document.createElement('span'); s.className = 'beat-num'; s.id = 'bn-'+i; s.textContent = i+1;
      patLayer.appendChild(s);
    }

    wrap.appendChild(countLayer); wrap.appendChild(patLayer);
    br.appendChild(wrap);
  }
  body.appendChild(br);

  /* ── 쓰기호흡 전용 진행바 + 세그먼트 ── */
  if (pat.scheduler === 'breathWrite') {
    const st = parseInt(SUB) || 2;
    const total = 4 + st; // 기다리기3 + 마시기1 + 쓰기st

    // ── 컨테이너: 전체 너비 기준, 모든 요소가 같은 grid ──
    const writeWrap = document.createElement('div');
    writeWrap.id = 'write-wrap';
    writeWrap.style.cssText = 'width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px;';

    // ── 숫자 라벨 행: grid로 total 등분, 마지막 경계는 absolute로 오른쪽 끝 ──
    const numRow = document.createElement('div'); numRow.id = 'pb-num-row';
    numRow.style.cssText = `position:relative;display:grid;grid-template-columns:repeat(${total},1fr);width:100%;`;
    const labels = ['1','2','3','4', ...Array.from({length:st},(_,i)=>String(i+1))];
    labels.forEach((lbl, i) => {
      const cell = document.createElement('div');
      cell.style.cssText = 'display:flex;align-items:center;justify-content:flex-start;';
      const span = document.createElement('span'); span.id = 'pbn-'+i;
      span.style.cssText = `font-family:'DM Mono',monospace;font-size:0.72rem;font-weight:600;transition:color 0.1s,text-shadow 0.1s;`;
      if (i<3) span.style.color='rgba(247,194,106,0.4)';
      else if (i===3) span.style.color='rgba(160,140,255,0.5)';
      else span.style.color='rgba(247,106,200,0.4)';
      span.textContent = lbl;
      cell.appendChild(span); numRow.appendChild(cell);
    });
    // 쓰기 끝 경계 숫자 — 숨김 처리 (보이면 안 됨)
    const endSpan = document.createElement('span'); endSpan.id = 'pbn-'+total;
    endSpan.style.cssText = `display:none;position:absolute;right:0;top:0;font-family:'DM Mono',monospace;font-size:0.72rem;font-weight:600;color:rgba(247,106,200,0.4);transition:color 0.1s,text-shadow 0.1s;`;
    endSpan.textContent = String(st+1);
    numRow.appendChild(endSpan);
    writeWrap.appendChild(numRow);

    // ── 진행 바: 같은 grid, 컬러 구간 정확히 일치 ──
    const track = document.createElement('div');
    track.style.cssText = `position:relative;width:100%;height:3px;border-radius:2px;overflow:visible;display:grid;grid-template-columns:repeat(${total},1fr);`;

    // 각 박 칸에 색상 배경
    for (let i=0; i<total; i++) {
      const cell = document.createElement('div');
      if (i<3) cell.style.background='rgba(247,194,106,0.25)';
      else if (i===3) cell.style.background='rgba(124,106,247,0.25)';
      else cell.style.background='rgba(247,106,200,0.25)';
      // 박 사이 구분선
      if (i<total-1) cell.style.borderRight='1px solid rgba(255,255,255,0.08)';
      track.appendChild(cell);
    }

    // 커서 (절대 위치, 트랙 위에 띄움)
    const trackWrap = document.createElement('div');
    trackWrap.style.cssText = 'position:relative;width:100%;';
    trackWrap.appendChild(track);
    const cursor = document.createElement('div'); cursor.id = 'pb-cursor';
    cursor.style.cssText = 'position:absolute;top:-5px;left:0%;width:3px;height:13px;border-radius:2px;background:white;box-shadow:0 0 8px 2px white;transition:left 1s linear,background 0.15s,box-shadow 0.15s;';
    trackWrap.appendChild(cursor);
    writeWrap.appendChild(trackWrap);

    // ── 세그먼트 박스: 같은 grid, 정확히 3:1:st ──
    const seg = document.createElement('div'); seg.className = 'write-segments';
    seg.style.cssText = `display:grid;grid-template-columns:3fr 1fr ${st}fr;gap:6px;width:100%;`;
    const ws  = document.createElement('div'); ws.className  = 'write-seg wait';    ws.textContent = '기다리기';
    const is2 = document.createElement('div'); is2.className = 'write-seg inhale';  is2.textContent = '마시기';
    const wrs = document.createElement('div'); wrs.className = 'write-seg write-s'; wrs.textContent = '쓰기';
    seg.appendChild(ws); seg.appendChild(is2); seg.appendChild(wrs);
    writeWrap.appendChild(seg);

    body.appendChild(writeWrap);
  }

  /* ── 인포박스 ── */
  const ib = document.createElement('div'); ib.className = 'info-box';
  const ia = document.createElement('div'); ia.className = 'info-action'; ia.id = 'info-action'; ia.textContent = '시작 버튼을 눌러주세요';
  const is2 = document.createElement('div'); is2.className = 'info-sub'; is2.id = 'info-sub'; is2.textContent = '';
  ib.appendChild(ia); ib.appendChild(is2); body.appendChild(ib);

  /* ── 타이머 ── */
  const tw = document.createElement('div'); tw.className = 'timer-wrap';
  const tm = document.createElement('div'); tm.className = 'timer-main'; tm.id = 'timer-main'; tm.textContent = '00:00.00';
  const lcc = document.createElement('div'); lcc.className = 'loop-counter'; lcc.id = 'loop-counter';
  lcc.textContent = pat.scheduler === 'breathHold' ? '0/'+(HTARGET>0?HTARGET:'∞') : '0/'+(TMODE==='basic'?'8':'∞');
  tw.appendChild(tm); tw.appendChild(lcc); body.appendChild(tw);

  /* ── 컨트롤 ── */
  const ctrl = document.createElement('div'); ctrl.className = 'controls';
  ctrl.innerHTML = `<button class="ctrl-btn reset" onclick="hardReset()">↺</button><button class="ctrl-btn play" id="play-btn" onclick="togglePlay()">▶</button><button class="ctrl-btn stop" onclick="stopExercise()">■</button>`;
  body.appendChild(ctrl);

  /* ── 볼륨 슬라이더 ── */
  const vw = document.createElement('div'); vw.className = 'vol-wrap';
  const vr = document.createElement('div'); vr.className = 'vol-row';
  vr.innerHTML = '<span>메트로놈</span>';
  const sl = document.createElement('input'); sl.type = 'range'; sl.min = '0'; sl.max = '100'; sl.value = String(Math.round(metronomeVol*100));
  sl.oninput = () => { metronomeVol = parseInt(sl.value)/100; if(metronomeGain) metronomeGain.gain.value = metronomeVol; };
  vr.appendChild(sl); vw.appendChild(vr); body.appendChild(vw);
}

function resetAndRebuild() { stopEngine(); elapsedSeconds=0; buildPracticeUI(); }
function hardReset() { stopEngine(); elapsedSeconds=0; isPaused=false; pausedElapsed=0; buildPracticeUI(); }

function togglePlay() {
  if (isPlaying) pauseEngine();
  else startEngine();
}

/* ════════════════════════════════════════════════
   【 섹션 G 】 비주얼 업데이트
════════════════════════════════════════════════ */
function applyVisual(vis) {
  if (!vis) return;
  const pat = currentPat(); if (!pat) return;

  if (vis.phase === 'counting') {
    if (pat.scheduler === 'breathHold') {
      const cl = document.getElementById('hold-count-layer'); if(cl) cl.style.display = 'flex';
      const nl = document.getElementById('hold-num-layer');  if(nl) nl.style.display = 'none';
      for (let i=0; i<4; i++) {
        const el = document.getElementById('bn-'+i); if(!el) continue;
        el.className = 'beat-num' + (i===vis.idx ? ' active-counting' : '');
      }
    } else if (pat.scheduler === 'breathCycle') {
      // 카운팅 레이어 보이고 패턴 레이어 숨김
      const cl = document.getElementById('bc-count-layer'); if(cl) cl.style.display = 'flex';
      const pl = document.getElementById('bc-pat-layer');   if(pl) pl.style.display = 'none';
      for (let i=0; i<4; i++) {
        const el = document.getElementById('bc-'+i); if(!el) continue;
        el.className = 'beat-num' + (i===vis.idx ? ' active-counting' : '');
      }
    } else {
      const el = document.getElementById('bn-'+vis.idx); if(el) el.className = 'beat-num active-counting';
    }
    setInfoBox('카운팅', '');
    return;
  }

  // 쓰기호흡: waiting / write / inhale 전부 applyWriteVisual로 (순서 중요 — exhale/inhale 분기보다 먼저)
  if (vis.phase === 'waiting' || vis.phase === 'write' || (vis.phase === 'inhale' && pat.scheduler === 'breathWrite')) {
    applyWriteVisual(vis);
    return;
  }

  if (vis.phase === 'exhale' || vis.phase === 'inhale') {
    // breathCycle: 카운팅 레이어 숨기고 패턴 레이어 보임
    const cl = document.getElementById('bc-count-layer'); if(cl) cl.style.display = 'none';
    const pl = document.getElementById('bc-pat-layer');   if(pl) pl.style.display = 'flex';
    const beats = parseInt(SUB) || 4;
    const cls = vis.phase === 'exhale' ? 'active-exhale' : 'active-inhale';
    for (let i=0; i<beats; i++) {
      const el = document.getElementById('bn-'+i); if (!el) continue;
      el.className = 'beat-num' + (i===vis.idx ? ' '+cls : '');
    }
    const loopMax = TMODE === 'basic' ? '8' : '∞';
    const lcc = document.getElementById('loop-counter'); if(lcc) lcc.textContent = (vis.loop||0)+'/'+loopMax;
    setInfoBox(vis.phase === 'exhale' ? '내쉬기' : '마시기', '');
    return;
  }

  if (vis.phase === 'hold') {
    const cl = document.getElementById('hold-count-layer'); if(cl) cl.style.display = 'none';
    const nl = document.getElementById('hold-num-layer');  if(nl) nl.style.display = 'flex';
    const bn = document.getElementById('hold-big-num');    if(bn) bn.textContent = vis.step;
    const lcc = document.getElementById('loop-counter');
    if (lcc) { const tk = HTARGET > 0 ? HTARGET : '∞'; lcc.textContent = vis.step+'/'+tk; }
    setInfoBox('S(스)', '');
    return;
  }
}

function applyWriteVisual(vis) {
  const st = parseInt(SUB) || 2, total = 4 + st;
  const phaseColor = { waiting:'rgba(230,165,20,1)', inhale:'rgba(124,106,247,1)', write:'rgba(247,106,200,1)' };
  const phaseDim   = { waiting:'rgba(247,194,106,0.35)', inhale:'rgba(124,106,247,0.45)', write:'rgba(247,106,200,0.35)' };
  const phaseGlow  = { waiting:'0 0 10px rgba(230,165,20,0.9)', inhale:'0 0 14px rgba(124,106,247,1)', write:'0 0 10px rgba(247,106,200,0.9)' };
  const colorMap   = { waiting:'active-counting', inhale:'active-inhale-bright', write:'active-write' };

  // 박자 숫자 하이라이트
  for (let i=0; i<total; i++) {
    const el = document.getElementById('bn-'+i); if (!el) continue;
    el.className = 'beat-num';
    if (i<3) el.classList.add('col-wait');
    else if (i===3) el.classList.add('col-inhale');
    else el.classList.add('col-write');
  }
  const activeEl = document.getElementById('bn-'+vis.idx);
  if (activeEl) activeEl.className = 'beat-num ' + (colorMap[vis.phase] || 'active-counting');

  // 커서: grid 기준 — 현재 박 왼쪽 끝 → 다음 박 왼쪽 끝으로 이동
  // 각 칸 너비 = 1/total, i번째 칸 왼쪽 = i/total * 100%
  const cursor = document.getElementById('pb-cursor');
  if (cursor) {
    const curPct  = (vis.idx / total) * 100;
    const nextPct = ((vis.idx + 1) / total) * 100;
    cursor.style.background  = phaseColor[vis.phase] || 'white';
    cursor.style.boxShadow   = '0 0 10px 3px ' + (phaseColor[vis.phase] || 'white');
    if (vis.idx === 0) {
      cursor.style.transition = 'none';
      cursor.style.left = curPct + '%';
      requestAnimationFrame(() => {
        cursor.style.transition = 'left ' + beatInterval + 's linear,background 0.15s,box-shadow 0.15s';
        cursor.style.left = nextPct + '%';
      });
    } else {
      cursor.style.transition = 'left ' + beatInterval + 's linear,background 0.15s,box-shadow 0.15s';
      cursor.style.left = nextPct + '%';
    }
  }

  // 숫자 라벨 하이라이트 (grid셀 안에 있으므로 색상만)
  for (let i=0; i<total; i++) {
    const span = document.getElementById('pbn-'+i); if (!span) continue;
    let phase = 'waiting'; if (i===3) phase='inhale'; else if (i>=4) phase='write';
    if (i === vis.idx) { span.style.color = phaseColor[phase]; span.style.textShadow = phaseGlow[phase]; }
    else               { span.style.color = phaseDim[phase];   span.style.textShadow = 'none'; }
  }

  // 세그먼트 활성화
  const segs = document.querySelectorAll('.write-seg'); segs.forEach(s=>s.classList.remove('active'));
  if (vis.phase==='waiting' && segs[0]) segs[0].classList.add('active');
  else if (vis.phase==='inhale'  && segs[1]) segs[1].classList.add('active');
  else if (vis.phase==='write'   && segs[2]) segs[2].classList.add('active');

  setInfoBox(({waiting:'기다리기', inhale:'마시기', write:'쓰기'})[vis.phase] || '', '');

  const loopMax = TMODE==='basic' ? '8' : '∞';
  const lcc = document.getElementById('loop-counter'); if(lcc) lcc.textContent = (vis.loop||0)+'/'+loopMax;
}

function setInfoBox(a, s) {
  const ae = document.getElementById('info-action'); if(ae) ae.textContent = a;
  const se = document.getElementById('info-sub');    if(se) se.textContent = s;
}

/* ════════════════════════════════════════════════
   【 섹션 H 】 종료 · 기록
════════════════════════════════════════════════ */
function pauseEngine() {
  isPlaying = false;
  clearInterval(schedulerTimer); schedulerTimer = null;
  cancelAnimationFrame(timerRafId); timerRafId = null;
  const pb = document.getElementById('play-btn'); if(pb) pb.textContent = '▶';
  const tm = document.getElementById('timer-main'); if(tm) tm.className = 'timer-main';
  isPaused = true; pausedElapsed = elapsedSeconds;
}

function stopEngine() {
  pauseEngine();
  beatQueue = []; stopScheduled = false;
  seqPhase = 'counting'; seqStep = 0; loopCount = 0; mainStartWallTime = 0;
  isPaused = false; pausedElapsed = 0; // 완전 정지 — 재개 아님
}

function stopExercise() {
  if (isPlaying || elapsedSeconds > 2) logPractice();
  stopEngine();
  elapsedSeconds = 0; isPaused = false; pausedElapsed = 0;
  // 비주얼 초기화
  document.querySelectorAll('.beat-num').forEach(b => b.className = 'beat-num');
  const tm = document.getElementById('timer-main'); if(tm) { tm.textContent='00:00.00'; tm.className='timer-main'; }
  const pb = document.getElementById('pb-cursor'); if(pb) { pb.style.transition='none'; pb.style.left='0%'; }
  const bn = document.getElementById('hold-big-num'); if(bn) bn.remove();
  const cl = document.getElementById('hold-count-layer'); if(cl) cl.style.display='flex';
  const nl = document.getElementById('hold-num-layer');  if(nl) nl.style.display='none';
  document.querySelectorAll('.write-seg').forEach(s=>s.classList.remove('active'));
  setInfoBox('시작 버튼을 눌러주세요', '');
}

function logPractice() {
  if (!currentProfileId || elapsedSeconds < 2) return;
  const pat = currentPat(); if (!pat) return;
  const now = new Date();
  if (!practiceLogs[currentProfileId]) practiceLogs[currentProfileId] = [];
  practiceLogs[currentProfileId].push({
    date: toDateStr(now),
    time: now.getHours()+':'+String(now.getMinutes()).padStart(2,'0'),
    chapter: 'breath',
    exercise: pat.name + (SUB ? ' ('+SUB+')' : ''),
    duration: Math.floor(elapsedSeconds),
  });
  saveData('somi_logs', practiceLogs);
}

function toDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function showSuccess(msg) {
  // 라벨박스(info-box) 안에서 메시지 표시
  const ae = document.getElementById('info-action');
  const se = document.getElementById('info-sub');
  if (ae) { ae.style.fontSize = '1.4rem'; ae.textContent = '🎉 ' + msg; }
  if (se) se.textContent = '↺ 버튼으로 다시 도전';
  // 플레이 버튼 초기화
  const pb = document.getElementById('play-btn'); if(pb) pb.textContent = '▶';
}
function closeSuccess() {
  document.getElementById('success-overlay').style.display = 'none';
  hardReset();
}

/* ════════════════════════════════════════════════
   【 섹션 I 】 카드 렌더 · 진입점
════════════════════════════════════════════════ */
function renderPatternCards() {
  const container = document.getElementById('pattern-cards'); container.innerHTML = '';

  BREATH_PATTERNS.forEach(pat => {
    const locked = isLocked(pat.id);
    const lvId = getPatternLevel(pat.id);
    const lv = levelSettings.find(l => l.id === lvId);

    const card = document.createElement('div');
    card.className = 'pattern-card' + (locked ? ' locked' : '');

    card.innerHTML = `
      <h3>${pat.name}</h3>
      <p>${pat.desc}</p>
      <div class="pattern-meta">
        ${lv ? `<span class="lv-badge">${lv.label}</span>` : ''}
        ${pat.tags.map(t=>`<span class="meta-tag">${t}</span>`).join('')}
        ${pat.modeLabels ? `<span class="meta-tag">${pat.modeLabels.join(' · ')}</span>` : ''}
      </div>
      ${locked ? '<div class="lock-overlay">🔒</div>' : ''}
    `;

    if (!locked) card.onclick = () => startExercise(pat.id);
    container.appendChild(card);
  });

  // 패턴 목록을 localStorage에 저장 → home.html(선생님)이 읽어서 관리
  try {
    const list = BREATH_PATTERNS.map(p => ({
      id: p.id, name: p.name, desc: p.desc, chapter: 'breath',
      bpm: p.bpm, level: p.level, modeLabels: p.modeLabels||['기본'], tags: p.tags,
    }));
    localStorage.setItem('somi_breath_patterns', JSON.stringify(list));
  } catch(e) {}
}
