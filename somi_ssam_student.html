<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- PWA: 홈 화면 추가 (아이콘/이름은 manifest.json과 icon-*.png 교체로 변경 가능) -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f5f0e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="소미쌤">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>학생 · somi_ssam</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--border:#2a2a3d;--accent:#7c6af7;--accent2:#f76ac8;--accent3:#6af7c8;--counting:#f7c26a;--text:#e8e8f0;--text2:#8888aa;}
.theme-ivory{--bg:#f5f0e8;--surface:#fffdf7;--surface2:#f0ebe0;--border:#d8cfc0;--accent:#6b5ce7;--accent2:#e05fa0;--accent3:#2db89a;--counting:#c8960a;--text:#2a2420;--text2:#7a6e60;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
#app{display:none;flex-direction:column;min-height:100vh;}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.brand-wrap{display:flex;flex-direction:column;gap:1px;text-align:right;}
.brand-title{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'DM Mono',monospace;}
.brand-sub{font-size:0.65rem;color:var(--text2);letter-spacing:3px;text-transform:uppercase;}
.home-link{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);text-decoration:none;font-size:0.88rem;font-weight:500;transition:all 0.2s;font-family:inherit;min-width:120px;justify-content:center;white-space:nowrap;}
.home-link:hover{border-color:var(--accent);color:var(--text);}
.student-tabs{display:flex;border-bottom:2px solid var(--border);background:var(--bg);position:sticky;top:var(--header-h,57px);z-index:99;overflow-x:auto;scrollbar-width:none;}
.student-tabs::-webkit-scrollbar{display:none;}
.stab{flex:1;min-width:80px;padding:12px 8px;border:none;background:none;color:var(--text2);font-family:inherit;font-size:0.88rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;white-space:nowrap;position:relative;}
.stab:hover{color:var(--text);}
.stab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
/* ── 설정 탭 빨간 점 ── */
.stab-dot{position:absolute;top:5px;right:2px;width:10px;height:10px;border-radius:50%;background:#ff0000;box-shadow:0 0 5px 1px rgba(255,0,0,0.8);display:none;}
.stab-dot.show{display:block;}
.home-content{padding:20px;max-width:600px;margin:0 auto;}
/* ── 오늘의 요약 ── */
.today-summary{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:24px;}
.today-summary h3{font-size:0.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
.summary-stats{display:flex;flex-direction:row;align-items:center;gap:20px;}
/* ── 도넛 그래프 영역 ── */
.sum-donut-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:90px;height:90px;}
/* ── 오른쪽 통계 영역 ── */
.sum-right{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center;}
.sum-row{display:flex;flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;}
.sum-row-lbl{font-size:0.75rem;color:var(--text2);white-space:nowrap;flex-shrink:0;}
.sum-row-val{font-size:1.9rem;font-weight:800;font-family:'DM Mono',monospace;color:var(--accent);letter-spacing:-1px;line-height:1.1;text-align:right;}
.sum-stat{text-align:center;}
.sum-stat .val{font-size:1.6rem;font-weight:700;font-family:'DM Mono',monospace;color:var(--accent);}
.sum-stat .lbl{font-size:0.7rem;color:var(--text2);margin-top:4px;}
.sum-chapters{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.sum-chapter-tag{font-size:0.75rem;padding:4px 12px;border-radius:20px;}
.sum-chapter-tag.breath{background:rgba(124,106,247,0.2);color:var(--accent);}
.sum-chapter-tag.vocal{background:rgba(247,106,200,0.2);color:var(--accent2);}
.sum-chapter-tag.rhythm{background:rgba(106,247,200,0.2);color:var(--accent3);}
.calendar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-header h3{font-size:1rem;font-weight:600;}
.cal-nav{background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.2rem;padding:4px 8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day-label{text-align:center;font-size:0.82rem;color:var(--text2);padding:7px 0;font-weight:600;}
.cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;min-height:40px;transition:all 0.2s;}
.cal-day:hover{background:var(--surface2);}
.cal-day.today{background:rgba(124,106,247,0.2);}
.cal-day.other-month{opacity:0.3;}
.date-num{position:relative;z-index:2;font-size:1rem;font-weight:500;line-height:1;}
.teacher-stamp{position:absolute;top:-2px;left:-2px;width:28px;height:28px;z-index:3;pointer-events:none;}
.student-stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none;}
.student-stamp svg{width:72%;height:72%;opacity:0.55;}
.practice-bar-wrap{position:absolute;bottom:2px;left:2px;right:2px;height:3px;display:flex;gap:1px;border-radius:2px;overflow:hidden;z-index:1;}
.practice-bar-seg{height:100%;border-radius:1px;}
/* ── 도장 피커 + 로딩 스피너 ── */
.stamp-picker{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:16px;position:relative;}
.stamp-picker h4{font-size:0.8rem;color:var(--text2);margin-bottom:10px;}
.stamp-options{display:flex;gap:10px;flex-wrap:wrap;}
.stamp-opt{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.stamp-opt:hover,.stamp-opt.active{border-color:var(--accent3);background:rgba(106,247,200,0.1);}
/* 도장 선택 로딩 오버레이 */
.stamp-loading-overlay{display:none;position:absolute;inset:0;border-radius:14px;background:rgba(10,10,15,0.55);align-items:center;justify-content:center;z-index:10;}
.stamp-loading-overlay.show{display:flex;}
.theme-ivory .stamp-loading-overlay{background:rgba(245,240,232,0.65);}
.stamp-spinner{width:24px;height:24px;border:2px solid var(--border);border-top:2px solid var(--accent3);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════ 공용 데이터 로딩 오버레이 (전 파일 공통 표준) ══════════ */
.somi-load-overlay{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(10,10,15,0.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:1;transition:opacity 0.35s ease;}
.theme-ivory .somi-load-overlay{background:rgba(245,240,232,0.85);}
.somi-load-overlay.hide{opacity:0;pointer-events:none;}
.somi-load-img-slot{width:84px;height:84px;display:flex;align-items:center;justify-content:center;}
.somi-load-img-slot img{width:100%;height:100%;object-fit:contain;border-radius:20px;}
.somi-load-spinner{width:52px;height:52px;border:4px solid var(--border);border-top:4px solid var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
.somi-load-text{color:var(--text);font-size:0.95rem;font-weight:600;letter-spacing:0.5px;}
.somi-load-sub{color:var(--text2);font-size:0.8rem;margin-top:-8px;}
.somi-load-slow{color:var(--counting);font-size:0.8rem;display:none;text-align:center;line-height:1.6;max-width:280px;}
.somi-load-slow.show{display:block;}
.somi-load-slow button{margin-top:10px;padding:8px 18px;border-radius:10px;border:1px solid var(--counting);background:transparent;color:var(--counting);font-size:0.8rem;font-weight:600;}
.chapter-goto{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:16px;padding:40px 20px;}
.chapter-goto .icon{font-size:3rem;}
.chapter-goto p{font-size:0.9rem;color:var(--text2);}
.goto-btn{padding:14px 32px;border-radius:14px;border:none;background:var(--accent);color:white;font-size:1rem;font-weight:600;font-family:inherit;transition:all 0.2s;}
.goto-btn:hover{background:#6a58e8;transform:scale(1.03);}
.settings-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.settings-box h4{font-size:0.88rem;color:var(--text2);margin-bottom:12px;}
/* ── 가로모드 + 모바일 반응형 ── */
@media (max-width:600px){
  .home-content{padding:14px;}
  .today-summary{padding:16px;margin-bottom:16px;}
  .summary-stats{gap:14px;}
  .sum-row-val{font-size:1.6rem;}
  .sum-row-lbl{font-size:0.7rem;}
  .sum-chapters{max-width:33%;gap:5px;margin-top:12px;}
  .calendar-wrap{padding:14px;}
  .stamp-picker{padding:12px;}
  .stamp-opt{width:40px;height:40px;}
}
@media (orientation:landscape) and (max-height:500px){
  .home-content{padding:10px;max-width:100%;}
  .today-summary{padding:12px 16px;margin-bottom:12px;border-radius:12px;}
  .today-summary h3{margin-bottom:10px;}
  .calendar-wrap{padding:12px;border-radius:12px;}
  .stamp-picker{margin-top:10px;padding:10px;}
  .student-tabs{position:static;}
  #stab-home{padding-bottom:20px;}
}
.settings-row{display:flex;gap:10px;align-items:center;min-width:0;}
.settings-input{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;box-sizing:border-box;width:100%;}
.settings-save{padding:10px 18px;border-radius:10px;border:none;background:var(--accent);color:white;font-family:inherit;font-size:0.85rem;cursor:pointer;font-weight:600;flex-shrink:0;white-space:nowrap;}
.log-table{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:12px;}
.log-table th{text-align:left;padding:8px 10px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500;font-size:0.72rem;}
.log-table td{padding:9px 10px;border-bottom:1px solid var(--border);}
.log-table tr:last-child td{border-bottom:none;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.68rem;font-weight:500;}
.pill.b{background:rgba(124,106,247,0.2);color:var(--accent);}
.pill.v{background:rgba(247,106,200,0.2);color:var(--accent2);}
.pill.r{background:rgba(106,247,200,0.2);color:var(--accent3);}
.gender-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:inherit;transition:all 0.2s;font-size:0.9rem;cursor:pointer;}
.gender-btn:hover{border-color:var(--accent);color:var(--text);}
.gender-btn.active{border-color:var(--accent);color:var(--text);background:rgba(124,106,247,0.15);}
.gender-select{display:flex;gap:10px;}
.settings-tab-wrap{padding:20px;max-width:400px;margin:0 auto;background:var(--bg);min-height:100vh;}
/* ── 미입력 안내 ── */
.info-missing-banner{padding:8px 12px;border-radius:10px;background:rgba(247,106,106,0.1);border:1px solid rgba(247,106,106,0.3);color:#f76a6a;font-size:0.78rem;margin-bottom:14px;display:none;}
.info-missing-banner.show{display:block;}
</style>
<script src="stamps.js"></script>
</head>
<body>

<!-- ══════════ 공용 데이터 로딩 오버레이 ══════════ -->
<div id="somi-load-overlay" class="somi-load-overlay">
  <div class="somi-load-img-slot"><div class="somi-load-spinner"></div></div>
  <div class="somi-load-text">데이터 불러오는 중...</div>
  <div class="somi-load-sub">SOMI_SSAM</div>
  <div class="somi-load-slow">
    연결이 평소보다 느려요.<br>계속 다시 시도하고 있어요.
    <br><button onclick="somiHideLoading()">오프라인으로 계속하기</button>
  </div>
</div>

<div id="app">
  <div class="app-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="home-link" id="teacher-mode-btn" style="display:none;" onclick="goToTeacherMode()">👩‍🏫 소미쌤</button>
      <button class="home-link" id="vocal-gender-toggle" style="display:none;" onclick="toggleVocalGender()" title="보컬랩 성별 미리보기 전환"></button>
    </div>
    <div style="width:120px;" id="header-spacer"></div>
    <div class="brand-wrap">
      <div class="brand-title">소미쌤</div>
      <div class="brand-sub">STUDENT · SOMI_SSAM</div>
    </div>
  </div>
  <div class="student-tabs">
    <button class="stab active" id="tab-home"     onclick="showTab('home',this)">🏠 <span id="tab-name-label">홈</span></button>
    <button class="stab"        id="tab-breath"   onclick="showTab('breath',this)">🫁 호흡</button>
    <button class="stab"        id="tab-vocal"    onclick="showTab('vocal',this)">🎵 발성</button>
    <button class="stab"        id="tab-rhythm"   onclick="showTab('rhythm',this)">🥁 리듬</button>
    <button class="stab"        id="tab-settings" onclick="showTab('settings',this)">⚙️ 설정<span class="stab-dot" id="settings-dot"></span></button>
  </div>
  <div id="stab-home" class="home-content">
    <div class="today-summary">
      <h3>오늘의 연습 성과</h3>
      <div class="summary-stats">
        <div class="sum-donut-wrap">
          <canvas id="sum-donut" width="90" height="90"></canvas>
        </div>
        <div class="sum-right">
          <div class="sum-row">
            <div class="sum-row-lbl">총 시간</div>
            <div class="sum-row-val" id="sum-time">0</div>
          </div>
          <div class="sum-row">
            <div class="sum-row-lbl">연속 일수</div>
            <div class="sum-row-val" id="sum-streak">0</div>
          </div>
        </div>
      </div>
      <div class="sum-chapters" id="sum-chapters"></div>
    </div>
    <div class="calendar-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="calMove(-1)">‹</button>
        <h3 id="cal-title"></h3>
        <button class="cal-nav" onclick="calMove(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
  <div id="stab-breath" style="display:none">
    <div class="chapter-goto"><div class="icon">🫁</div><p>호흡 연습 페이지로 이동합니다</p><button class="goto-btn" onclick="goToChapter('breath')">호흡 연습 시작 →</button></div>
  </div>
  <div id="stab-vocal" style="display:none">
    <div class="chapter-goto"><div class="icon">🎵</div><p>발성 연습 페이지로 이동합니다</p><button class="goto-btn" onclick="goToChapter('vocal')">발성 연습 시작 →</button></div>
  </div>
  <div id="stab-rhythm" style="display:none">
    <div class="chapter-goto"><div class="icon">🥁</div><p>리듬 연습 페이지로 이동합니다</p><button class="goto-btn" onclick="goToChapter('rhythm')">리듬 연습 시작 →</button></div>
  </div>
  <div id="stab-settings" style="display:none">
    <div class="settings-tab-wrap">
      <!-- 기본 정보 미입력 안내 배너 -->
      <div class="info-missing-banner" id="info-missing-banner">
        ⚠️ 기본 정보(이름·성별·생년월일)를 모두 입력하면 이 안내가 사라져요
      </div>
      <div class="settings-box"><h4>이름 변경</h4>
        <div class="settings-row"><input type="text" class="settings-input" id="s-name-input" placeholder="이름"><button class="settings-save" onclick="saveStudentSettings()">저장</button></div>
      </div>
      <div class="settings-box"><h4>성별 변경</h4>
        <div class="gender-select" style="max-width:220px;">
          <button class="gender-btn" id="s-gbtn-f" onclick="sSelectGender('female')">여자</button>
          <button class="gender-btn" id="s-gbtn-m" onclick="sSelectGender('male')">남자</button>
        </div>
      </div>
      <!-- ★ 생년월일 설정 -->
      <div class="settings-box"><h4>생년월일</h4>
        <div class="settings-row">
          <input type="date" class="settings-input" id="s-birth-input">
          <button class="settings-save" onclick="saveStudentBirth()">저장</button>
        </div>
      </div>
      <div class="settings-box"><h4>테마 색상</h4>
        <div class="gender-select">
          <button class="gender-btn" id="theme-dark"  onclick="setTheme('dark')">🌙 다크</button>
          <button class="gender-btn" id="theme-ivory" onclick="setTheme('ivory')">☀️ 아이보리</button>
        </div>
      </div>
      <div class="settings-box"><h4>비밀번호 변경</h4>
        <div class="settings-row"><input type="password" class="settings-input" id="s-pw-input" placeholder="새 비밀번호"><button class="settings-save" onclick="saveStudentPw()">변경</button></div>
      </div>
      <div style="margin-top:8px;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;">
        <p style="font-size:0.78rem;color:var(--text2);margin-bottom:4px;line-height:1.7;">자동 로그인을 해제하고 로그인 화면으로 돌아갑니다.</p>
        <p style="font-size:0.78rem;color:var(--text2);margin-bottom:14px;line-height:1.7;">연습 기록과 데이터는 그대로 유지돼요 🔒</p>
        <button onclick="studentLogout()" style="width:100%;padding:13px;border-radius:12px;border:1px solid #f76a6a;background:transparent;color:#f76a6a;font-family:inherit;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='rgba(247,106,106,0.1)'" onmouseout="this.style.background='transparent'">🚪 로그아웃</button>
      </div>
    </div>
  </div>
</div>
<script>
const STUDENT_AUTO_KEY='somi_student_auto_login';
const TEACHER_AUTO_KEY='somi_teacher_auto_login';

function loadData(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function saveData(k,v){try{const j=JSON.stringify(v);localStorage.setItem(k,j);if(window._fsSet&&k!=='somi_profiles')window._fsSet(k,j);}catch(e){}}

/* ── 공용 로딩 오버레이 제어 ── */
let _somiLoadTimer=null;
function somiStartSlowTimer(){
  const o=document.getElementById('somi-load-overlay'); if(!o) return;
  const slow=o.querySelector('.somi-load-slow'); if(slow) slow.classList.remove('show');
  clearTimeout(_somiLoadTimer);
  _somiLoadTimer=setTimeout(()=>{ if(slow) slow.classList.add('show'); },25000);
}
function somiShowLoading(text){
  const o=document.getElementById('somi-load-overlay'); if(!o) return;
  if(text){ const t=o.querySelector('.somi-load-text'); if(t) t.textContent=text; }
  o.classList.remove('hide'); somiStartSlowTimer();
}
function somiHideLoading(){
  const o=document.getElementById('somi-load-overlay'); if(!o) return;

/* ── 안전가드용 Firebase 핸들 + 안전 명단 저장 ── */
let _fbHandle=null;
async function safePutProfiles(newProfiles){
  if(!Array.isArray(newProfiles) || newProfiles.length===0){
    console.error('🛑 안전가드(student): 빈 명단 저장 차단'); return {ok:false};
  }
  let remote=[];
  if(_fbHandle){
    try{ const s=await _fbHandle.getDoc(_fbHandle.doc(_fbHandle.db,'somi_data','somi_profiles')); if(s.exists()) remote=JSON.parse(s.data().value)||[]; }catch(e){}
  }
  if(remote.length > newProfiles.length){
    console.error('🛑 안전가드(student): 명단 축소 차단 ('+remote.length+'→'+newProfiles.length+')'); return {ok:false};
  }
  if(_fbHandle){
    try{ await _fbHandle.setDoc(_fbHandle.doc(_fbHandle.db,'somi_data','somi_profiles_backup_'+Date.now()),{value:JSON.stringify(remote.length?remote:newProfiles)}); }catch(e){}
    try{ await _fbHandle.setDoc(_fbHandle.doc(_fbHandle.db,'somi_data','somi_profiles'),{value:JSON.stringify(newProfiles)}); }catch(e){}
  }
  return {ok:true};
}

/* ════════════════════════════════════
   시간 한글 포맷 (5번 요구사항)
════════════════════════════════════ */
function formatDur(s){
  s=Math.round(s)||0;
  if(s<=0) return '0초';
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  if(h>0){ if(m>0) return h+'시간'+m+'분'; return h+'시간'; }
  if(m>0){ if(sec>0) return m+'분'+sec+'초'; return m+'분'; }
  return sec+'초';
}

  // 소미쌤 기기 + 짝(pairId)이 연결된 프로필일 때만 토글 표시
  const pair=(currentProfile&&currentProfile.pairId)?profiles.find(p=>p.id===currentProfile.pairId):null;

function toDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ════════════════════════════════════
   파이 차트 렌더
════════════════════════════════════ */
function renderDonut(logs){
  const canvas=document.getElementById('sum-donut');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const cx=45,cy=45,R=38;
  ctx.clearRect(0,0,90,90);
  const counts={breath:0,vocal:0,rhythm:0};
  logs.forEach(l=>{if(counts[l.chapter]!==undefined)counts[l.chapter]++;});
  const total=logs.length;
  const colors={breath:'#7c6af7',vocal:'#f76ac8',rhythm:'#6af7c8'};
  const order=['breath','vocal','rhythm'];
  if(total===0){
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.fillStyle='#3a3a4a';ctx.fill();
    return;
  }
  let start=-Math.PI/2;
  order.forEach(ch=>{
    const cnt=counts[ch];
    if(cnt===0) return;
    const angle=(cnt/total)*2*Math.PI;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,start,start+angle);ctx.closePath();
    ctx.fillStyle=colors[ch];ctx.fill();
    start+=angle;
  });
}

function updateSummary(){
  practiceLogs=loadData('somi_logs',{});
  const allLogs=(practiceLogs[currentProfile.id]||[]);
  const today=toDateStr(new Date()),todayLogs=allLogs.filter(l=>l.date===today);
  // 파이 차트 — 오늘 기준
  renderDonut(todayLogs);
  // 총 시간 — 오늘 기준
  const sec=todayLogs.reduce((a,l)=>a+(l.duration||0),0);
  document.getElementById('sum-time').textContent=sec>0?formatDur(sec):'0초';
  // 연속 일수
  let streak=0,d=new Date();
  for(let i=0;i<365;i++){if(allLogs.some(l=>l.date===toDateStr(d))){streak++;d.setDate(d.getDate()-1);}else break;}
  const streakEl=document.getElementById('sum-streak');
  streakEl.textContent=streak+'일';
  streakEl.style.color='var(--counting)';
  // 챕터 비율 한줄 — 오늘 기준
  const chCounts={breath:0,vocal:0,rhythm:0};
  todayLogs.forEach(l=>{if(chCounts[l.chapter]!==undefined)chCounts[l.chapter]++;});
  const todayTotal=todayLogs.length||1;
  const bP=Math.round(chCounts.breath/todayTotal*100);
  const vP=Math.round(chCounts.vocal/todayTotal*100);
  const rP=100-bP-vP;
  const parts=[];
  if(chCounts.breath>0) parts.push(`<span class="sum-chapter-tag breath">호흡 ${bP}%</span>`);
  if(chCounts.vocal>0)  parts.push(`<span class="sum-chapter-tag vocal">발성 ${vP}%</span>`);
  if(chCounts.rhythm>0) parts.push(`<span class="sum-chapter-tag rhythm">리듬 ${rP}%</span>`);
  document.getElementById('sum-chapters').innerHTML=parts.join('');
}

function renderCalendar(){
  practiceLogs=loadData('somi_logs',{});teacherStamps=loadData('somi_teacher_stamps',{});studentDayStamps=loadData('somi_student_day_stamps',{});
  const grid=document.getElementById('cal-grid');
  document.getElementById('cal-title').textContent=calYear+'년 '+(calMonth+1)+'월';
  grid.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach(d=>{const l=document.createElement('div');l.className='cal-day-label';l.textContent=d;grid.appendChild(l);});
  const first=new Date(calYear,calMonth,1).getDay(),days=new Date(calYear,calMonth+1,0).getDate(),prev=new Date(calYear,calMonth,0).getDate();
  const today=toDateStr(new Date()),logs=practiceLogs[currentProfile.id]||[];
  for(let i=0;i<first;i++){const d=document.createElement('div');d.className='cal-day other-month';const dn=document.createElement('span');dn.className='date-num';dn.textContent=prev-first+1+i;d.appendChild(dn);grid.appendChild(d);}
  for(let d=1;d<=days;d++){
    const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayLogs=logs.filter(l=>l.date===ds);
    const div=document.createElement('div');div.className='cal-day'+(ds===today?' today':'');
    if(dayLogs.length>0){
      const tk=currentProfile.id+'_'+ds;
      if(teacherStamps[tk]){const tl=document.createElement('div');tl.className='teacher-stamp';tl.innerHTML=getTeacherStampSVG(teacherStamps[tk].stamp, 20);div.appendChild(tl);}
      const dayStamp=studentDayStamps[currentProfile.id+'_'+ds];
      if(dayStamp){const sl=document.createElement('div');sl.className='student-stamp';sl.innerHTML=getStampSVG(dayStamp);div.appendChild(sl);}
    }
    const dn=document.createElement('span');dn.className='date-num';if(dayLogs.length>0)dn.style.fontWeight='800';dn.textContent=d;div.appendChild(dn);
    if(dayLogs.length>0){const bw=document.createElement('div');bw.className='practice-bar-wrap';['breath','vocal','rhythm'].forEach(c=>{const cnt=dayLogs.filter(l=>l.chapter===c).length;if(cnt>0){const seg=document.createElement('div');seg.className='practice-bar-seg';seg.style.flex=String(cnt);seg.style.background=c==='breath'?'var(--accent)':c==='vocal'?'var(--accent2)':'var(--accent3)';bw.appendChild(seg);}});div.appendChild(bw);}
    div.onclick=()=>showDayLog(ds);grid.appendChild(div);
  }
}

  const overlay=document.getElementById('stamp-loading');

function selectDayStamp(dateStr,key,el){
  const k=currentProfile.id+'_'+dateStr;
  if(studentDayStamps[k]===key){ delete studentDayStamps[k]; el.classList.remove('active'); } // 같은 도장 다시 누르면 해제

  saveStudentDayStamps();
  el.parentElement.querySelectorAll('.stamp-opt').forEach(o=>o.classList.toggle('active',o.getAttribute('data-stamp')===studentDayStamps[k]));

  document.getElementById('s-gbtn-m').classList.toggle('active',currentProfile.gender==='male');
  // 생년월일
  const bi=document.getElementById('s-birth-input');
  if(bi) bi.value=currentProfile.birth||'';
  document.getElementById('theme-dark').classList.toggle('active',currentTheme==='dark');
  document.getElementById('theme-ivory').classList.toggle('active',currentTheme==='ivory');
  updateSettingsDot();
}
let sGender='';
function sSelectGender(g){sGender=g;document.getElementById('s-gbtn-f').classList.toggle('active',g==='female');document.getElementById('s-gbtn-m').classList.toggle('active',g==='male');}
function saveStudentSettings(){
  const name=document.getElementById('s-name-input').value.trim();
  if(name) currentProfile.name=name;
  if(sGender) currentProfile.gender=sGender;
  saveProfiles();
  document.getElementById('tab-name-label').textContent=currentProfile.name;
  updateSettingsDot();
  alert('저장됐어요!');
}
function saveStudentBirth(){
  const bi=document.getElementById('s-birth-input');
  if(!bi) return;
  currentProfile.birth=bi.value||'';
  saveProfiles();
  updateSettingsDot();
  alert('생년월일이 저장됐어요!');
}
function saveStudentPw(){const pw=document.getElementById('s-pw-input').value;if(!pw)return;currentProfile.password=pw;saveProfiles();alert('비밀번호가 변경됐어요!');document.getElementById('s-pw-input').value='';}
function setTheme(t){currentTheme=t;saveData('somi_theme',t);document.body.classList.toggle('theme-ivory',t==='ivory');document.getElementById('theme-dark').classList.toggle('active',t==='dark');document.getElementById('theme-ivory').classList.toggle('active',t==='ivory');}



/* ════════════════════════════════════
   DOMContentLoaded
════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',async function(){
  if(currentTheme==='ivory')document.body.classList.add('theme-ivory');
  somiStartSlowTimer();  // 오버레이는 HTML에 떠 있음 — 슬로우 안내만 예약
  // 도장 피커 초기 생성
  _reinjectStampSVGs();
  const savedId=localStorage.getItem('somi_current_profile_id');
  if(savedId){
    profiles=loadData('somi_profiles',[]);
    const found=profiles.find(p=>p.id===savedId);
    if(found){
      currentProfile=found;
      enterStudentApp();
    } else {
      somiHideLoading();
      window.location.href='index.html';
    }
  } else {
    somiHideLoading();
    window.location.href='index.html';
  }
  // 비상구 버튼이 눌리면 재시도 중단
  let _offlineForced=false;
  somiHideLoading = (function(orig){
    return function(){ _offlineForced=true; orig(); };
  })(somiHideLoading);

  let _syncOk=false;
  while(!_offlineForced && !_syncOk){
   try{
    const{initializeApp,getApps}=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
    const{getFirestore,doc,getDoc,setDoc}=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
    const APP_NAME='somi-student-v3';
    const fbApp=getApps().find(a=>a.name===APP_NAME)||initializeApp({apiKey:"AIzaSyCgCdb1pNtcTxEp7APdUW-aeOsJ33v1IhI",authDomain:"somi-ssam.firebaseapp.com",projectId:"somi-ssam",storageBucket:"somi-ssam.firebasestorage.app",messagingSenderId:"841594074779",appId:"1:841594074779:web:c37fd00db5a8883cf0f83e"},APP_NAME);
    const fsDb=getFirestore(fbApp);
    window._fsSet=async(k,j)=>{try{await setDoc(doc(fsDb,"somi_data",k),{value:j});}catch(e){}};
    _fbHandle={db:fsDb, doc, getDoc, setDoc};  // 안전가드용 핸들 보관
    await Promise.all(['somi_profiles','somi_logs','somi_teacher_stamps','somi_student_day_stamps','somi_class_settings','somi_lesson_starts','somi_pattern_locks','somi_pattern_levels','somi_level_settings','somi_access_log'].map(async k=>{const snap=await getDoc(doc(fsDb,"somi_data",k));if(snap.exists())localStorage.setItem(k,snap.data().value);}));
    // 내 세션 키도 Firebase에서 로드 (다른 기기 로그인 감지용)
    if(currentProfile){
      try{const snap=await getDoc(doc(fsDb,'somi_data','somi_student_session_'+currentProfile.id));if(snap.exists())localStorage.setItem('somi_student_session_'+currentProfile.id,snap.data().value);}catch(e){}
    }
    profiles=loadData('somi_profiles',[]);
    practiceLogs=loadData('somi_logs',{});
    teacherStamps=loadData('somi_teacher_stamps',{});
    classSettings=loadData('somi_class_settings',{});
    lessonStarts=loadData('somi_lesson_starts',{});
    // Firebase 완료 후 홈 재렌더링 — 도장 SVG 반드시 재주입
    if(currentProfile){
      const r=profiles.find(p=>p.id===currentProfile.id);
      if(r) currentProfile=r;
      // Firebase에서 받은 stamp로 currentStamp 갱신
      currentStamp=currentProfile.stamp||'apple';
      // 도장 재주입 후 렌더 (타이밍 버그 원천 차단)
      _reinjectStampSVGs();
      document.querySelectorAll('.stamp-opt').forEach(el=>el.classList.toggle('active',el.getAttribute('data-stamp')===currentStamp));
      renderStudentHome();
      updateSettingsDot();
    }
    // ── 세션 유효성 체크 — 다른 기기에서 로그인 시 자동 로그아웃 ──
    if(currentProfile){
      try{
        const snap=await getDoc(doc(fsDb,'somi_data','somi_student_session_'+currentProfile.id));
        if(snap.exists()){
          const serverSession=JSON.parse(snap.data().value);
          const mySession=loadData('somi_student_session_'+currentProfile.id,null);
          if(mySession&&serverSession.token!==mySession.token){
            // 다른 기기에서 로그인됨 → 자동 로그아웃
            localStorage.removeItem(STUDENT_AUTO_KEY);
            localStorage.removeItem('somi_current_profile_id');
            localStorage.removeItem('somi_student_session_'+currentProfile.id);
            alert('다른 기기에서 로그인되어 자동으로 로그아웃되었습니다 😊');
            window.location.href='index.html';
            return;
          }
        }
      }catch(e){}
    }
    // 접속기록 저장 — Firebase 로드 완료 후 (당일 중복 시 시간만 업데이트)
    if(currentProfile){
      const now=new Date();
      const dateStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
      const timeStr=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
      const aLog=loadData('somi_access_log',{});
      if(!aLog[currentProfile.id]) aLog[currentProfile.id]=[];
      const arr=aLog[currentProfile.id];
      const todayIdx=arr.findIndex(r=>r.date===dateStr);
      if(todayIdx>=0){ arr[todayIdx].time=timeStr; }
      else { arr.push({date:dateStr,time:timeStr}); }
      saveData('somi_access_log',aLog);
    }
    _syncOk=true;
    somiHideLoading();  // 동기화 완료 — 혹시 아직 떠있으면 확실히 해제
   }catch(e){
     console.warn('student Firebase 동기화 재시도:',e.message);
     await new Promise(r=>setTimeout(r,1500));
   }
  }
});
</script>
