<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 · somi_ssam</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c27;--border:#2a2a3d;--accent:#7c6af7;--accent2:#f76ac8;--accent3:#6af7c8;--counting:#f7c26a;--text:#e8e8f0;--text2:#8888aa;}
.theme-ivory{--bg:#f5f0e8;--surface:#fffdf7;--surface2:#f0ebe0;--border:#d8cfc0;--accent:#6b5ce7;--accent2:#e05fa0;--accent3:#2db89a;--counting:#c8960a;--text:#2a2420;--text2:#7a6e60;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;visibility:hidden;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
#profile-screen{display:none;flex-direction:column;align-items:center;min-height:100vh;padding:24px;gap:20px;background:radial-gradient(ellipse at 30% 20%,#1a1040 0%,var(--bg) 60%);}
.theme-ivory #profile-screen{background:radial-gradient(ellipse at 30% 20%,#e0d5c5 0%,var(--bg) 60%);}
.profile-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all 0.2s;width:100%;max-width:480px;}
.profile-item:hover{border-color:var(--accent);transform:translateX(4px);}
.profile-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0;}
.profile-avatar.female{background:linear-gradient(135deg,var(--accent2),#c96af7);}
.profile-avatar.male{background:linear-gradient(135deg,var(--accent),#6ab4f7);}
.new-profile-btn{width:100%;max-width:480px;padding:16px;border-radius:16px;border:1px dashed var(--border);background:transparent;color:var(--text2);font-size:0.9rem;transition:all 0.2s;}
.new-profile-btn:hover{border-color:var(--accent3);color:var(--accent3);}
.create-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px;}
.form-group{display:flex;flex-direction:column;gap:8px;}
.form-label{font-size:0.8rem;color:var(--text2);}
.form-input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:0.95rem;font-family:inherit;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--accent);}
.gender-select{display:flex;gap:10px;}
.gender-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:inherit;transition:all 0.2s;font-size:0.9rem;}
.gender-btn.active{border-color:var(--accent);color:var(--text);background:rgba(124,106,247,0.15);}
#profile-pw-screen,#create-profile-screen{display:none;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:32px;padding:24px;background:radial-gradient(ellipse at 70% 80%,#1a1040 0%,var(--bg) 60%);}
.theme-ivory #profile-pw-screen,.theme-ivory #create-profile-screen{background:radial-gradient(ellipse at 70% 80%,#e0d5c5 0%,var(--bg) 60%);}
.pw-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px 40px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:20px;}
.pw-box h2{font-size:1.2rem;font-weight:700;text-align:center;}
.pw-box p{font-size:0.82rem;color:var(--text2);text-align:center;}
.pw-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-size:1rem;font-family:inherit;outline:none;text-align:center;letter-spacing:4px;transition:border-color 0.2s;}
.pw-input:focus{border-color:var(--accent);}
.pw-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent);color:white;font-size:1rem;font-weight:600;transition:all 0.2s;}
.pw-btn:hover{background:#6a58e8;}
.pw-btn.secondary{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.pw-btn.secondary:hover{border-color:var(--accent);color:var(--text);}
.pw-error{color:#f76a6a;font-size:0.8rem;text-align:center;display:none;}
#app{display:none;flex-direction:column;min-height:100vh;}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.brand-wrap{display:flex;flex-direction:column;gap:1px;text-align:right;}
.brand-title{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-family:'DM Mono',monospace;}
.brand-sub{font-size:0.65rem;color:var(--text2);letter-spacing:3px;text-transform:uppercase;}
.home-link{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);text-decoration:none;font-size:0.88rem;font-weight:500;transition:all 0.2s;font-family:inherit;min-width:120px;justify-content:center;white-space:nowrap;}
.home-link:hover{border-color:var(--accent);color:var(--text);}
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:10px 20px;border-radius:10px;font-size:0.88rem;font-weight:500;transition:all 0.2s;font-family:inherit;cursor:pointer;min-width:120px;justify-content:center;white-space:nowrap;}
.back-btn:hover{border-color:var(--accent);color:var(--text);}
.student-tabs{display:flex;border-bottom:2px solid var(--border);background:var(--bg);position:sticky;top:57px;z-index:99;overflow-x:auto;scrollbar-width:none;}
.student-tabs::-webkit-scrollbar{display:none;}
.stab{flex:1;min-width:80px;padding:12px 8px;border:none;background:none;color:var(--text2);font-family:inherit;font-size:0.88rem;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s;white-space:nowrap;}
.stab:hover{color:var(--text);}
.stab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700;}
.home-content{padding:20px;max-width:600px;margin:0 auto;}
.today-summary{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:24px;}
.today-summary h3{font-size:0.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:16px;}
.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.sum-stat{text-align:center;}
.sum-stat .val{font-size:1.6rem;font-weight:700;font-family:'DM Mono',monospace;color:var(--accent);}
.sum-stat .lbl{font-size:0.7rem;color:var(--text2);margin-top:4px;}
.sum-chapters{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.sum-chapter-tag{font-size:0.75rem;padding:4px 12px;border-radius:20px;}
.sum-chapter-tag.breath{background:rgba(124,106,247,0.2);color:var(--accent);}
.sum-chapter-tag.vocal{background:rgba(247,106,200,0.2);color:var(--accent2);}
.sum-chapter-tag.rhythm{background:rgba(106,247,200,0.2);color:var(--accent3);}
.calendar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-header h3{font-size:1rem;font-weight:600;}
.cal-nav{background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.2rem;padding:4px 8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day-label{text-align:center;font-size:0.82rem;color:var(--text2);padding:7px 0;font-weight:600;}
.cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;min-height:40px;transition:all 0.2s;}
.cal-day:hover{background:var(--surface2);}
.cal-day.today{background:rgba(124,106,247,0.2);}
.cal-day.other-month{opacity:0.3;}
.date-num{position:relative;z-index:2;font-size:1rem;font-weight:500;line-height:1;}
.teacher-stamp{position:absolute;top:-2px;left:-2px;width:28px;height:28px;z-index:3;pointer-events:none;}
.student-stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:0;pointer-events:none;}
.student-stamp svg{width:85%;height:85%;opacity:0.55;}
.practice-bar-wrap{position:absolute;bottom:2px;left:2px;right:2px;height:3px;display:flex;gap:1px;border-radius:2px;overflow:hidden;z-index:1;}
.practice-bar-seg{height:100%;border-radius:1px;}
.stamp-picker{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:16px;}
.stamp-picker h4{font-size:0.8rem;color:var(--text2);margin-bottom:10px;}
.stamp-options{display:flex;gap:10px;flex-wrap:wrap;}
.stamp-opt{width:44px;height:44px;border-radius:10px;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.stamp-opt:hover,.stamp-opt.active{border-color:var(--accent3);background:rgba(106,247,200,0.1);}
.chapter-goto{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;gap:16px;padding:40px 20px;}
.chapter-goto .icon{font-size:3rem;}
.chapter-goto p{font-size:0.9rem;color:var(--text2);}
.goto-btn{padding:14px 32px;border-radius:14px;border:none;background:var(--accent);color:white;font-size:1rem;font-weight:600;font-family:inherit;transition:all 0.2s;}
.goto-btn:hover{background:#6a58e8;transform:scale(1.03);}
.settings-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.settings-box h4{font-size:0.88rem;color:var(--text2);margin-bottom:12px;}
.settings-row{display:flex;gap:10px;align-items:center;}
.settings-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none;}
.settings-save{padding:10px 18px;border-radius:10px;border:none;background:var(--accent);color:white;font-family:inherit;font-size:0.85rem;cursor:pointer;font-weight:600;}
.log-table{width:100%;border-collapse:collapse;font-size:0.8rem;margin-top:12px;}
.log-table th{text-align:left;padding:8px 10px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:500;font-size:0.72rem;}
.log-table td{padding:9px 10px;border-bottom:1px solid var(--border);}
.log-table tr:last-child td{border-bottom:none;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.68rem;font-weight:500;}
.pill.b{background:rgba(124,106,247,0.2);color:var(--accent);}
.pill.v{background:rgba(247,106,200,0.2);color:var(--accent2);}
.pill.r{background:rgba(106,247,200,0.2);color:var(--accent3);}
</style>
</head>
<body>
<div id="profile-screen">
  <div style="width:100%;max-width:480px;padding-top:16px;display:flex;align-items:center;justify-content:space-between;">
    <h2 style="font-size:1.2rem;font-weight:700">학생 선택</h2>
    <a href="index.html" class="back-btn" style="text-decoration:none;">← 홈</a>
  </div>
  <div style="width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;" id="profile-list"></div>
  <button class="new-profile-btn" onclick="showCreateProfile()">+ 새 프로필 만들기</button>
</div>
<div id="profile-pw-screen">
  <div class="pw-box">
    <h2 id="ppw-name">이름</h2><p>비밀번호를 입력해주세요</p>
    <input type="password" class="pw-input" id="ppw-input" placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter')checkProfilePw()">
    <div class="pw-error" id="ppw-error">비밀번호가 틀렸어요</div>
    <button class="pw-btn" onclick="checkProfilePw()">확인</button>
    <button class="pw-btn secondary" onclick="showProfileSelect()">← 뒤로</button>
  </div>
</div>
<div id="create-profile-screen">
  <div class="create-box">
    <h2>프로필 만들기</h2>
    <div class="form-group"><div class="form-label">이름</div><input type="text" class="form-input" id="new-name" placeholder="이름을 입력하세요"></div>
    <div class="form-group"><div class="form-label">성별</div>
      <div class="gender-select">
        <button class="gender-btn" id="gbtn-f" onclick="selectGender('female')">여자</button>
        <button class="gender-btn" id="gbtn-m" onclick="selectGender('male')">남자</button>
      </div>
    </div>
    <div class="form-group"><div class="form-label">비밀번호</div><input type="password" class="form-input" id="new-pw" placeholder="비밀번호를 설정하세요" maxlength="20"></div>
    <div class="pw-error" id="create-error">이름, 성별, 비밀번호를 모두 입력해주세요</div>
    <button class="pw-btn" onclick="createProfile()">프로필 생성</button>
    <button class="pw-btn secondary" onclick="showProfileSelect()">← 뒤로</button>
  </div>
</div>
<div id="app">
  <div class="app-header">
    <a class="home-link" href="index.html">← 로그인</a>
    <div class="brand-wrap">
      <div class="brand-title">소미쌤</div>
      <div class="brand-sub">STUDENT · SOMI_SSAM</div>
    </div>
  </div>
  <div class="student-tabs">
    <button class="stab active" id="tab-home"     onclick="showTab('home',this)">🏠 <span id="tab-name-label">홈</span></button>
    <button class="stab"        id="tab-breath"   onclick="showTab('breath',this)">🫁 호흡</button>
    <button class="stab"        id="tab-vocal"    onclick="showTab('vocal',this)">🎵 발성</button>
    <button class="stab"        id="tab-rhythm"   onclick="showTab('rhythm',this)">🥁 리듬</button>
    <button class="stab"        id="tab-settings" onclick="showTab('settings',this)">⚙️ 설정</button>
  </div>
  <div id="stab-home" class="home-content">
    <div class="today-summary">
      <h3>오늘의 연습 성과</h3>
      <div class="summary-stats">
        <div class="sum-stat"><div class="val" id="sum-count">0</div><div class="lbl">연습 횟수</div></div>
        <div class="sum-stat"><div class="val" id="sum-time">0m</div><div class="lbl">총 시간</div></div>
        <div class="sum-stat"><div class="val" id="sum-streak">0</div><div class="lbl">연속 일수</div></div>
      </div>
      <div class="sum-chapters" id="sum-chapters"></div>
    </div>
    <div class="calendar-wrap">
      <div class="cal-header">
        <button class="cal-nav" onclick="calMove(-1)">‹</button>
        <h3 id="cal-title"></h3>
        <button class="cal-nav" onclick="calMove(1)">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
    <div class="stamp-picker" style="margin-top:16px">
      <h4>이번 주 도장 선택</h4>
      <div class="stamp-options">
        <div class="stamp-opt active" data-stamp="apple"     onclick="selectStamp('apple',this)"></div>
        <div class="stamp-opt"        data-stamp="sunflower" onclick="selectStamp('sunflower',this)"></div>
        <div class="stamp-opt"        data-stamp="cloud"     onclick="selectStamp('cloud',this)"></div>
        <div class="stamp-opt"        data-stamp="acorn"     onclick="selectStamp('acorn',this)"></div>
      </div>
    </div>
  </div>
  <div id="stab-breath" style="display:none">
    <div class="chapter-goto"><div class="icon">🫁</div><p>호흡 연습 페이지로 이동합니다</p><button class="goto-btn" onclick="goToChapter('breath')">호흡 연습 시작 →</button></div>
  </div>
  <div id="stab-vocal" style="display:none">
    <div class="chapter-goto"><div class="icon">🎵</div><p>발성 연습 페이지로 이동합니다</p><button class="goto-btn" onclick="goToChapter('vocal')">발성 연습 시작 →</button></div>
  </div>
  <div id="stab-rhythm" style="display:none">
    <div class="chapter-goto"><div class="icon">🥁</div><p>리듬 연습 페이지로 이동합니다</p><button class="goto-btn" onclick="goToChapter('rhythm')">리듬 연습 시작 →</button></div>
  </div>
  <div id="stab-settings" style="display:none">
    <div style="padding:20px;max-width:400px;margin:0 auto;">
      <div class="settings-box"><h4>이름 변경</h4>
        <div class="settings-row"><input type="text" class="settings-input" id="s-name-input" placeholder="이름"><button class="settings-save" onclick="saveStudentSettings()">저장</button></div>
      </div>
      <div class="settings-box"><h4>성별 변경</h4>
        <div class="gender-select" style="max-width:220px;">
          <button class="gender-btn" id="s-gbtn-f" onclick="sSelectGender('female')">여자</button>
          <button class="gender-btn" id="s-gbtn-m" onclick="sSelectGender('male')">남자</button>
        </div>
      </div>
      <div class="settings-box"><h4>테마 색상</h4>
        <div style="display:flex;gap:10px;">
          <button class="gender-btn" id="theme-dark"  onclick="setTheme('dark')">🌙 다크</button>
          <button class="gender-btn" id="theme-ivory" onclick="setTheme('ivory')">☀️ 아이보리</button>
        </div>
      </div>
      <div class="settings-box"><h4>비밀번호 변경</h4>
        <div class="settings-row"><input type="password" class="settings-input" id="s-pw-input" placeholder="새 비밀번호"><button class="settings-save" onclick="saveStudentPw()">변경</button></div>
      </div>
    </div>
  </div>
</div>
<script>
function loadData(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function saveData(k,v){try{const j=JSON.stringify(v);localStorage.setItem(k,j);if(window._fsSet)window._fsSet(k,j);}catch(e){}}

let profiles=loadData('somi_profiles',[]);
let practiceLogs=loadData('somi_logs',{});
let teacherStamps=loadData('somi_teacher_stamps',{});
let classSettings=loadData('somi_class_settings',{});
let lessonStarts=loadData('somi_lesson_starts',{});
let currentTheme=loadData('somi_theme','dark');
let currentProfile=null, currentStamp='apple', calYear, calMonth;

function saveProfiles(){saveData('somi_profiles',profiles);}
function getClassInfo(pid){return classSettings[pid]||{voClass:null,extras:[]};}
function getDaysSinceLesson(pid){const s=lessonStarts[pid];if(!s)return null;return Math.floor((new Date()-new Date(s))/(1000*60*60*24))+1;}

function showScreen(id){
  ['profile-screen','profile-pw-screen','create-profile-screen','app'].forEach(s=>{const el=document.getElementById(s);if(el)el.style.display='none';});
  const t=document.getElementById(id);if(!t)return;
  if(id==='profile-screen'){t.style.display='flex';t.style.flexDirection='column';}
  else t.style.display='flex';
}
function goStudentHome(){currentProfile=null;localStorage.removeItem('somi_current_profile_id');showProfileSelect();}
function showProfileSelect(){renderProfileList();showScreen('profile-screen');}
function renderProfileList(){
  const list=document.getElementById('profile-list');list.innerHTML='';
  if(!profiles.length){list.innerHTML='<p style="color:var(--text2);text-align:center;padding:20px">아직 프로필이 없어요</p>';return;}
  profiles.forEach((p,i)=>{
    const div=document.createElement('div');div.className='profile-item';
    div.innerHTML=`<div class="profile-avatar ${p.gender}">${p.name[0]}</div><div style="flex:1"><h4 style="font-size:0.95rem;font-weight:600">${p.name}</h4><p style="font-size:0.75rem;color:var(--text2)">${p.gender==='female'?'여자':'남자'}</p></div><div style="color:var(--text2);font-size:1.2rem">›</div>`;
    div.onclick=()=>selectProfile(i);list.appendChild(div);
  });
}
let pendingProfileIdx=-1;
function selectProfile(idx){pendingProfileIdx=idx;document.getElementById('ppw-name').textContent=profiles[idx].name;document.getElementById('ppw-input').value='';document.getElementById('ppw-error').style.display='none';showScreen('profile-pw-screen');}
function checkProfilePw(){
  if(document.getElementById('ppw-input').value===profiles[pendingProfileIdx].password){
    currentProfile=profiles[pendingProfileIdx];localStorage.setItem('somi_current_profile_id',currentProfile.id);enterStudentApp();
  }else document.getElementById('ppw-error').style.display='block';
}
let selectedGender='';
function showCreateProfile(){document.getElementById('new-name').value='';document.getElementById('new-pw').value='';selectedGender='';document.getElementById('gbtn-f').classList.remove('active');document.getElementById('gbtn-m').classList.remove('active');document.getElementById('create-error').style.display='none';showScreen('create-profile-screen');}
function selectGender(g){selectedGender=g;document.getElementById('gbtn-f').classList.toggle('active',g==='female');document.getElementById('gbtn-m').classList.toggle('active',g==='male');}
function createProfile(){
  const name=document.getElementById('new-name').value.trim(),pw=document.getElementById('new-pw').value;
  if(!name||!selectedGender||!pw){document.getElementById('create-error').style.display='block';return;}
  const newId=Date.now().toString();
  profiles.push({id:newId,name,gender:selectedGender,password:pw,stamp:'apple',createdAt:new Date().toISOString()});
  saveProfiles();
  // 신규 프로필 — 모든 패턴 자동 잠금 (선생님이 반 설정 후 Lv1 패턴만 열림)
  try{
    const locks=JSON.parse(localStorage.getItem('somi_pattern_locks')||'{}');
    const allPatterns=[
      ...JSON.parse(localStorage.getItem('somi_vocal_patterns')||'[]'),
      ...JSON.parse(localStorage.getItem('somi_breath_patterns')||'[]'),
      ...JSON.parse(localStorage.getItem('somi_rhythm_patterns')||'[]'),
    ];
    locks[newId]={};
    allPatterns.forEach(p=>{ locks[newId][p.id]=false; });
    localStorage.setItem('somi_pattern_locks',JSON.stringify(locks));
  }catch(e){}
  showProfileSelect();
}
function enterStudentApp(){
  showScreen('app');
  document.getElementById('tab-name-label').textContent=currentProfile.name;
  currentStamp=currentProfile.stamp||'apple';
  document.querySelectorAll('.stamp-opt').forEach(el=>el.classList.toggle('active',el.getAttribute('data-stamp')===currentStamp));
  showTab('home',document.getElementById('tab-home'));
}
function showTab(tab,btn){
  if(tab==='breath'||tab==='vocal'||tab==='rhythm'){goToChapter(tab);return;}
  ['home','breath','vocal','rhythm','settings'].forEach(t=>{const el=document.getElementById('stab-'+t);if(el)el.style.display='none';});
  const target=document.getElementById('stab-'+tab);if(target)target.style.display='block';
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  if(tab==='home')renderStudentHome();
  else if(tab==='settings')initStudentSettings();
}
function goToChapter(tab){
  if(currentProfile)localStorage.setItem('somi_current_profile_id',currentProfile.id);
  window.location.href=tab==='breath'?'somi_ssam_breath.html':tab==='vocal'?'somi_ssam_vocal_lab.html':'somi_ssam_rhythm_groove.html';
}
function renderStudentHome(){const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();renderClassInfo();updateSummary();renderCalendar();}
function renderClassInfo(){
  classSettings=loadData('somi_class_settings',{});lessonStarts=loadData('somi_lesson_starts',{});
  const ci=getClassInfo(currentProfile.id),voClass=ci.voClass||'(반 미설정)',extras=ci.extras||[],days=getDaysSinceLesson(currentProfile.id);
  let box=document.getElementById('class-info-box');
  if(!box){box=document.createElement('div');box.id='class-info-box';document.getElementById('stab-home').insertBefore(box,document.getElementById('stab-home').firstChild);}
  box.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 24px;margin-bottom:16px;';
  box.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;"><div style="display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap;"><span style="font-size:2rem;font-weight:800;">${currentProfile.name}</span><span style="font-size:2rem;font-weight:800;color:var(--accent);">${voClass}</span><div style="display:flex;flex-direction:column;gap:4px;">${['리베','시창'].map(ex=>{const on=extras.includes(ex);return`<span style="padding:2px 12px;border-radius:20px;font-size:0.82rem;font-weight:600;border:1.5px solid ${on?'var(--accent3)':'var(--border)'};color:${on?'var(--accent3)':'var(--text2)'};background:${on?'rgba(106,247,200,0.1)':'var(--surface2)'};${on?'':'opacity:0.45;'}">${ex}</span>`;}).join('')}</div></div>${days?`<div style="text-align:center;"><div style="font-size:0.72rem;font-weight:700;color:var(--accent2);">소미쌤과</div><div style="font-size:2rem;font-weight:800;color:var(--accent2);">+${days}일✨</div></div>`:''}</div>`;
}
function toDateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDur(s){return s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s';}
function updateSummary(){
  practiceLogs=loadData('somi_logs',{});
  const today=toDateStr(new Date()),logs=(practiceLogs[currentProfile.id]||[]).filter(l=>l.date===today);
  document.getElementById('sum-count').textContent=logs.length;
  const sec=logs.reduce((a,l)=>a+(l.duration||0),0);document.getElementById('sum-time').textContent=sec>=60?Math.floor(sec/60)+'m':sec+'s';
  let streak=0,d=new Date();for(let i=0;i<365;i++){if((practiceLogs[currentProfile.id]||[]).some(l=>l.date===toDateStr(d))){streak++;d.setDate(d.getDate()-1);}else break;}
  document.getElementById('sum-streak').textContent=streak;
  const ch=[...new Set(logs.map(l=>l.chapter))];document.getElementById('sum-chapters').innerHTML=ch.map(c=>`<span class="sum-chapter-tag ${c}">${c==='breath'?'호흡':c==='vocal'?'발성':'리듬'}</span>`).join('');
}
function renderCalendar(){
  practiceLogs=loadData('somi_logs',{});teacherStamps=loadData('somi_teacher_stamps',{});
  const grid=document.getElementById('cal-grid');document.getElementById('cal-title').textContent=calYear+'년 '+(calMonth+1)+'월';grid.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach(d=>{const l=document.createElement('div');l.className='cal-day-label';l.textContent=d;grid.appendChild(l);});
  const first=new Date(calYear,calMonth,1).getDay(),days=new Date(calYear,calMonth+1,0).getDate(),prev=new Date(calYear,calMonth,0).getDate();
  const today=toDateStr(new Date()),logs=practiceLogs[currentProfile.id]||[];
  for(let i=0;i<first;i++){const d=document.createElement('div');d.className='cal-day other-month';const dn=document.createElement('span');dn.className='date-num';dn.textContent=prev-first+1+i;d.appendChild(dn);grid.appendChild(d);}
  for(let d=1;d<=days;d++){
    const ds=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayLogs=logs.filter(l=>l.date===ds);
    const div=document.createElement('div');div.className='cal-day'+(ds===today?' today':'');
    if(dayLogs.length>0){
      const tk=currentProfile.id+'_'+ds;
      if(teacherStamps[tk]){const tl=document.createElement('div');tl.className='teacher-stamp';tl.innerHTML=`<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:rotate(-15deg)"><path d="M12 2.5 C12.3 2.5 12.6 4.2 13.2 6.1 L14.5 10.2 L18.8 10.3 C20.1 10.3 20.8 10.8 20.3 11.5 L16.9 14.1 L18.3 18.2 C18.8 19.5 18.3 20.2 17.2 19.6 L12 16.8 L6.8 19.6 C5.7 20.2 5.2 19.5 5.7 18.2 L7.1 14.1 L3.7 11.5 C3.2 10.8 3.9 10.3 5.2 10.3 L9.5 10.2 L10.8 6.1 C11.4 4.2 11.7 2.5 12 2.5Z" stroke="#f7c26a" stroke-width="1.5" fill="rgba(247,194,106,0.2)"/></svg>`;div.appendChild(tl);}
      const sl=document.createElement('div');sl.className='student-stamp';sl.innerHTML=getStampSVG(currentStamp);div.appendChild(sl);
    }
    const dn=document.createElement('span');dn.className='date-num';if(dayLogs.length>0)dn.style.fontWeight='800';dn.textContent=d;div.appendChild(dn);
    if(dayLogs.length>0){const bw=document.createElement('div');bw.className='practice-bar-wrap';['breath','vocal','rhythm'].forEach(c=>{const cnt=dayLogs.filter(l=>l.chapter===c).length;if(cnt>0){const seg=document.createElement('div');seg.className='practice-bar-seg';seg.style.flex=String(cnt);seg.style.background=c==='breath'?'var(--accent)':c==='vocal'?'var(--accent2)':'var(--accent3)';bw.appendChild(seg);}});div.appendChild(bw);}
    div.onclick=()=>showDayLog(ds);grid.appendChild(div);
  }
}
function calMove(dir){calMonth+=dir;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function selectStamp(key,el){currentStamp=key;if(currentProfile){currentProfile.stamp=key;saveProfiles();}document.querySelectorAll('.stamp-opt').forEach(o=>o.classList.remove('active'));el.classList.add('active');renderCalendar();}
function showDayLog(dateStr){
  const logs=(practiceLogs[currentProfile.id]||[]).filter(l=>l.date===dateStr);
  let box=document.getElementById('inline-day-log');
  if(!box){box=document.createElement('div');box.id='inline-day-log';box.style.cssText='margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;';document.getElementById('stab-home').appendChild(box);}
  const pc=c=>c==='breath'?'b':c==='vocal'?'v':'r',cn=c=>c==='breath'?'호흡':c==='vocal'?'발성':'리듬';
  box.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><h3 style="font-size:1rem;font-weight:700">${dateStr} 연습 기록</h3><button onclick="document.getElementById('inline-day-log').remove()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:1.2rem">✕</button></div>`+(logs.length?`<table class="log-table"><thead><tr><th>시간</th><th>챕터</th><th>항목</th><th>시간</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${l.time||''}</td><td><span class="pill ${pc(l.chapter)}">${cn(l.chapter)}</span></td><td>${l.exercise||''}</td><td>${formatDur(l.duration||0)}</td></tr>`).join('')}</tbody></table>`:'<p style="color:var(--text2);text-align:center;padding:16px">연습 기록이 없어요</p>');
  box.scrollIntoView({behavior:'smooth'});
}
function initStudentSettings(){
  const ni=document.getElementById('s-name-input');if(ni)ni.value=currentProfile.name;
  document.getElementById('s-gbtn-f').classList.toggle('active',currentProfile.gender==='female');
  document.getElementById('s-gbtn-m').classList.toggle('active',currentProfile.gender==='male');
  document.getElementById('theme-dark').classList.toggle('active',currentTheme==='dark');
  document.getElementById('theme-ivory').classList.toggle('active',currentTheme==='ivory');
}
let sGender='';
function sSelectGender(g){sGender=g;document.getElementById('s-gbtn-f').classList.toggle('active',g==='female');document.getElementById('s-gbtn-m').classList.toggle('active',g==='male');}
function saveStudentSettings(){const name=document.getElementById('s-name-input').value.trim();if(name)currentProfile.name=name;if(sGender)currentProfile.gender=sGender;saveProfiles();document.getElementById('tab-name-label').textContent=currentProfile.name;alert('저장됐어요!');}
function saveStudentPw(){const pw=document.getElementById('s-pw-input').value;if(!pw)return;currentProfile.password=pw;saveProfiles();alert('비밀번호가 변경됐어요!');document.getElementById('s-pw-input').value='';}
function setTheme(t){currentTheme=t;saveData('somi_theme',t);document.body.classList.toggle('theme-ivory',t==='ivory');document.getElementById('theme-dark').classList.toggle('active',t==='dark');document.getElementById('theme-ivory').classList.toggle('active',t==='ivory');}
const STAMPS={apple:{svg:`<svg viewBox="0 0 40 40" fill="none"><path d="M20.3 9.1 C20.1 9 17.2 6.3 14.8 7.1 C14.7 7.1 13.2 4.3 15.9 3.3 C16 3.3 18.7 2.2 20.2 5.6" stroke="#e85555" stroke-width="1.7" stroke-linecap="round" fill="none"/><path d="M20.2 9.1 C14.1 8.5 9.2 13.2 8.7 22.1 C9.9 28.5 13.6 33.5 17.6 34.7 C18.6 35 21.3 35.1 22.4 34.6 C27.1 32.8 31.8 19.4 20.2 9.1Z" stroke="#e85555" stroke-width="1.9" stroke-linecap="round" fill="rgba(232,85,85,0.13)"/><path d="M20.2 9.1 C21.3 6.9 23.8 6.3 25.8 7.4" stroke="#4a8c3f" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>`},sunflower:{svg:`<svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="5" stroke="#7a4f1e" stroke-width="1.8" fill="rgba(122,79,30,0.15)"/><path d="M20 7v4M20 29v4M7 20h4M29 20h4" stroke="#f5c842" stroke-width="2.1" stroke-linecap="round"/><path d="M11.5 11.5l2.8 2.8M25.7 25.7l2.8 2.8M28.5 11.5l-2.8 2.8M14.3 25.7l-2.8 2.8" stroke="#f5c842" stroke-width="2" stroke-linecap="round"/></svg>`},cloud:{svg:`<svg viewBox="0 0 40 40" fill="none"><path d="M10.3 27.2 C6.1 27.4 3.8 24.3 3.9 21.1 C4 17.8 6.4 15.3 9.6 15.2 C9.8 9.2 15.6 8.3 23.1 13.1 C24.6 12.5 27.7 12.9 29.2 14.8 C32.8 16.3 34.3 21.1 31.6 25.2 C30.4 27.1 28 28.3 25.6 28.1M10.3 27.2 C14 27.8 20.3 28 25.6 28.1" stroke="#6ab4f7" stroke-width="1.9" stroke-linecap="round" fill="rgba(106,180,247,0.13)"/></svg>`},acorn:{svg:`<svg viewBox="0 0 40 40" fill="none"><path d="M12.8 12.1 C12.6 11.2 13.5 10.8 20.1 10.9 C26.7 11 27.4 11.4 27.2 12.3 C26.9 14.8 25.1 17.3 20.1 17.4 C15 17.5 13.1 14.9 12.8 12.1Z" stroke="#8b6914" stroke-width="1.8" fill="rgba(139,105,20,0.15)"/><path d="M15.3 17.8 C14.8 21.9 17.3 29.8 20.1 32.3 C22.9 29.8 25.4 21.8 24.9 17.8" stroke="#c8902a" stroke-width="1.9" fill="rgba(200,144,42,0.15)"/></svg>`}};
function getStampSVG(key){return(STAMPS[key]||STAMPS.apple).svg;}
document.addEventListener('DOMContentLoaded',async function(){
  if(currentTheme==='ivory')document.body.classList.add('theme-ivory');
  document.querySelectorAll('.stamp-opt[data-stamp]').forEach(el=>{el.innerHTML=getStampSVG(el.getAttribute('data-stamp'));});
  const savedId=localStorage.getItem('somi_current_profile_id');
  if(savedId){profiles=loadData('somi_profiles',[]);const found=profiles.find(p=>p.id===savedId);if(found){currentProfile=found;document.body.style.visibility='visible';enterStudentApp();}else{document.body.style.visibility='visible';showProfileSelect();}}
  else{document.body.style.visibility='visible';showProfileSelect();}
  try{
    const{initializeApp}=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js");
    const{getFirestore,doc,getDoc,setDoc}=await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");
    const fbApp=initializeApp({apiKey:"AIzaSyCgCdb1pNtcTxEp7APdUW-aeOsJ33v1IhI",authDomain:"somi-ssam.firebaseapp.com",projectId:"somi-ssam",storageBucket:"somi-ssam.firebasestorage.app",messagingSenderId:"841594074779",appId:"1:841594074779:web:c37fd00db5a8883cf0f83e"},'somi-student-v2');
    const fsDb=getFirestore(fbApp);
    window._fsSet=async(k,j)=>{try{await setDoc(doc(fsDb,"somi_data",k),{value:j});}catch(e){}};
    await Promise.all(['somi_profiles','somi_logs','somi_teacher_stamps','somi_class_settings','somi_lesson_starts','somi_pattern_locks','somi_pattern_levels','somi_level_settings'].map(async k=>{try{const snap=await getDoc(doc(fsDb,"somi_data",k));if(snap.exists())localStorage.setItem(k,snap.data().value);}catch(e){}}));
    profiles=loadData('somi_profiles',[]);practiceLogs=loadData('somi_logs',{});teacherStamps=loadData('somi_teacher_stamps',{});classSettings=loadData('somi_class_settings',{});lessonStarts=loadData('somi_lesson_starts',{});
    if(currentProfile){const r=profiles.find(p=>p.id===currentProfile.id);if(r)currentProfile=r;if(document.getElementById('stab-home').style.display!=='none')renderStudentHome();}
    else renderProfileList();
  }catch(e){console.warn('Firebase 연결 실패:',e);}
});
</script>
